<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Invites · Kudzu Arts</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#fbfaf7">
<link rel="icon" href="img/logo-k.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/v3.css">
<link rel="stylesheet" href="css/account.css">
<style>
  .inv { max-width: 560px; }
  .inv h1 { font-family: var(--serif, Georgia, serif); font-size: 21px; margin-bottom: 6px; }
  .inv .sub { color: #888; margin: 0 0 26px; }

  .inv-new { display: grid; gap: 10px; padding: 16px; border: 1px solid #e2e2e2; background: #fff; }
  .inv-new input { width: 100%; padding: 11px 12px; border: 1px solid #e2e2e2; font: inherit; }
  .inv-new .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .inv-new .big { padding: 13px; font-size: 14px; }

  .inv-out { margin: 22px 0 0; padding: 18px; border: 1px solid #dae2f5; background: #eef2fb; text-align: center; }
  .inv-out[hidden] { display: none; }
  .inv-out .who { font-style: italic; margin-bottom: 14px; }
  .inv-out canvas { width: 200px; height: 200px; background: #fff; padding: 8px; border: 1px solid #e2e2e2; }
  .inv-out .link { word-break: break-all; font-family: var(--mono, monospace); font-size: 11px; color: #555; margin: 14px 0 12px; }
  .inv-out .acts { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .inv-out .exp { color: #888; margin-top: 12px; }
  .inv-out .warn { color: #b3261e; margin-top: 10px; }

  .inv-list { margin-top: 32px; }
  .inv-list h2 { font-size: 13px; color: #888; margin-bottom: 10px; }
  .inv-row { display: flex; justify-content: space-between; gap: 12px; align-items: baseline;
             padding: 11px 0; border-bottom: 1px solid #e2e2e2; }
  .inv-row .n { color: #111; }
  .inv-row .s { font-size: 12px; white-space: nowrap; }
  .inv-row .s.open { color: #2b2bd6; }
  .inv-row .s.used { color: #888; text-decoration: line-through; }
  .inv-row .s.exp  { color: #b3261e; }
  @media (max-width: 480px) { .inv-new .row { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<header class="site-header">
  <a href="index.html" class="brand"><img class="mark" src="img/logo-k.png" alt="" aria-hidden="true"><span class="word"><b>KUDZU</b><span class="arts">arts</span></span></a>
  <nav class="nav" aria-label="Primary">
    <a href="artists.html">Artists</a>
    <a href="profile.html">Profile</a>
  </nav>
  <button class="nav-toggle" type="button" aria-expanded="false">Menu</button>
</header>

<main class="acct inv">
  <h1>invites</h1>
  <p class="sub">One link, one artist, one signup. Spent the moment it's used.</p>

  <div class="inv-new">
    <input id="invName" type="text" placeholder="Artist's name" autocomplete="off">
    <div class="row">
      <input id="invEmail" type="email" placeholder="Their email (optional)" autocomplete="off">
      <select id="invDays" style="padding:11px 12px;border:1px solid #e2e2e2;font:inherit;">
        <option value="7">expires in 7 days</option>
        <option value="14" selected>expires in 14 days</option>
        <option value="30">expires in 30 days</option>
      </select>
    </div>
    <button class="acct-btn big" type="button" id="makeBtn">New invite</button>
    <p class="hint" style="color:#888;margin:0;">Adding an email locks the link to that address — nobody else can use it.</p>
  </div>

  <section class="inv-out" id="out" hidden>
    <p class="who" id="outWho"></p>
    <canvas id="qr" width="200" height="200" aria-label="QR code for the invite link"></canvas>
    <p class="link" id="outLink"></p>
    <div class="acts">
      <button class="acct-btn" type="button" id="shareBtn" hidden>Share</button>
      <button class="acct-btn ghost" type="button" id="copyBtn">Copy link</button>
    </div>
    <p class="exp" id="outExp"></p>
    <p class="warn">Send this now — you can't get it back later.</p>
  </section>

  <section class="inv-list">
    <h2>recent invites</h2>
    <div id="list"><p class="acct-empty" id="listEmpty">No invites yet.</p></div>
  </section>

  <!-- Admin only: fix a typo on any artist's page without them having
       to do it themselves. Hidden until we know the signed-in artist
       is actually an admin — the server enforces this regardless. -->
  <section class="inv-list" id="artistsSection" hidden>
    <h2>edit an artist's profile</h2>
    <select id="artistPick" style="width:100%;padding:11px 12px;border:1px solid #e2e2e2;font:inherit;">
      <option value="">Choose an artist…</option>
    </select>

    <div class="inv-new" id="artistEdit" hidden style="margin-top:14px;">
      <input id="aName" type="text" placeholder="Name">
      <div class="row">
        <input id="aBornYear" type="number" placeholder="Born year">
        <input id="aBornCountry" type="text" placeholder="Born — country">
      </div>
      <div class="row">
        <input id="aWorksCity" type="text" placeholder="Works — city">
        <input id="aWorksCountry" type="text" placeholder="Works — country">
      </div>
      <input id="aLink" type="url" placeholder="Website">
      <textarea id="aBio" rows="4" placeholder="Bio"
        style="width:100%;padding:11px 12px;border:1px solid #e2e2e2;font:inherit;resize:vertical;"></textarea>
      <textarea id="aCv" rows="4" placeholder="C.V. — one line per entry"
        style="width:100%;padding:11px 12px;border:1px solid #e2e2e2;font:inherit;resize:vertical;"></textarea>
      <div style="display:flex;align-items:center;gap:12px;">
        <button class="acct-btn big" type="button" id="artistSaveBtn">Save changes</button>
        <span id="artistSaveNote" style="color:#555;"></span>
      </div>
    </div>
  </section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.0.3/qrcode.min.js"></script>
<script>
/* QR rendering via the qrcode-generator library (kazuhikoarase, MIT),
   loaded above from cdnjs. Swapped in after the previous hand-rolled
   encoder was silently failing on some invite URLs and leaving the
   canvas blank with no error shown anywhere. */
window.drawQR = function (canvas, text) {
  try {
    var qr = qrcode(0, 'L'); // typeNumber 0 = auto-size, level L
    qr.addData(text);
    qr.make();
    var count = qr.getModuleCount();
    var px = Math.floor(canvas.width / (count + 8));
    var off = Math.floor((canvas.width - px * count) / 2);
    var c = canvas.getContext('2d');
    c.fillStyle = '#fff';
    c.fillRect(0, 0, canvas.width, canvas.height);
    c.fillStyle = '#000';
    for (var row = 0; row < count; row++) {
      for (var col = 0; col < count; col++) {
        if (qr.isDark(row, col)) c.fillRect(off + col * px, off + row * px, px, px);
      }
    }
    return true;
  } catch (e) {
    console.error('QR render failed:', e);
    return false;
  }
};
</script>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var current = null;

  function fmtDate(d) {
    return new Date(d).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  }

  async function load() {
    try {
      var data = await fetch('/api/invites', { credentials: 'same-origin' })
        .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); });
      renderList(data.invites || []);
    } catch (e) {
      $('listEmpty').textContent = e.message === '401'
        ? 'Log in to manage invites.'
        : 'Invite list will appear once the backend is live.';
    }
  }

  function renderList(rows) {
    var box = $('list');
    if (!rows.length) return;
    box.innerHTML = '';
    rows.forEach(function (r) {
      var status = r.usedAt ? 'used' : (new Date(r.expiresAt) < new Date() ? 'exp' : 'open');
      var label = status === 'used' ? 'signed up ' + fmtDate(r.usedAt)
                : status === 'exp'  ? 'expired'
                : 'open · expires ' + fmtDate(r.expiresAt);
      var row = document.createElement('div');
      row.className = 'inv-row';
      row.innerHTML = '<span class="n"></span><span class="s ' + status + '"></span>';
      row.querySelector('.n').textContent = r.note || r.email || 'unnamed';
      row.querySelector('.s').textContent = label;
      box.appendChild(row);
    });
  }

  $('makeBtn').addEventListener('click', async function () {
    var btn = this;
    var note = $('invName').value.trim();
    var email = $('invEmail').value.trim();
    btn.disabled = true; btn.textContent = 'Creating…';
    try {
      var res = await fetch('/api/invites', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'same-origin',
        body: JSON.stringify({ note: note, email: email, days: +$('invDays').value })
      });
      if (!res.ok) throw new Error(res.status);
      var data = await res.json();
      current = data.url;

      $('outWho').textContent = note ? 'for ' + note : 'invite link';
      $('outLink').textContent = data.url;
      $('outExp').textContent = 'Expires ' + fmtDate(data.expiresAt) + '.';
      $('out').hidden = false;
      if (!drawQR($('qr'), data.url)) {
        $('qr').style.display = 'none';
      }
      $('shareBtn').hidden = !navigator.share;
      $('invName').value = ''; $('invEmail').value = '';
      $('out').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      load();
    } catch (e) {
      alert(e.message === '401'
        ? 'Log in first.'
        : 'Invites need the backend running. Not available yet.');
    } finally {
      btn.disabled = false; btn.textContent = 'New invite';
    }
  });

  $('copyBtn').addEventListener('click', async function () {
    if (!current) return;
    try { await navigator.clipboard.writeText(current); } catch (e) {}
    this.textContent = 'Copied ✓';
    var b = this;
    setTimeout(function () { b.textContent = 'Copy link'; }, 1600);
  });

  $('shareBtn').addEventListener('click', function () {
    if (!current || !navigator.share) return;
    navigator.share({
      title: 'Your Kudzu Arts invite',
      text: 'Set up your Kudzu Arts artist page here — this link works once.',
      url: current
    }).catch(function () {});
  });

  // ── Edit an artist's profile (admin only) ─────────────────────────
  // The server is the real gate here — this just stays hidden unless
  // the request actually succeeds, so non-admins never see an empty
  // picker that fails the moment they touch it.
  var artistsById = {};

  async function loadArtists() {
    try {
      var data = await fetch('/api/admin/artists', { credentials: 'same-origin' })
        .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); });
      var pick = $('artistPick');
      (data.artists || []).forEach(function (a) {
        artistsById[a.id] = a;
        var opt = document.createElement('option');
        opt.value = a.id;
        opt.textContent = a.name + (a.published ? '' : '  (not public yet)');
        pick.appendChild(opt);
      });
      $('artistsSection').hidden = false;
    } catch (e) {
      // Not an admin, or backend not up — leave this whole section out.
    }
  }

  $('artistPick').addEventListener('change', function () {
    var a = artistsById[this.value];
    if (!a) { $('artistEdit').hidden = true; return; }
    $('aName').value = a.name || '';
    $('aBornYear').value = a.bornYear || '';
    $('aBornCountry').value = a.bornCountry || '';
    $('aWorksCity').value = a.worksCity || '';
    $('aWorksCountry').value = a.worksCountry || '';
    $('aLink').value = a.link || '';
    $('aBio').value = a.bio || '';
    $('aCv').value = a.cv || '';
    $('artistSaveNote').textContent = '';
    $('artistEdit').hidden = false;
  });

  $('artistSaveBtn').addEventListener('click', async function () {
    var id = $('artistPick').value;
    if (!id) return;
    var btn = this, note = $('artistSaveNote');
    btn.disabled = true; btn.textContent = 'Saving…'; note.textContent = '';
    try {
      var res = await fetch('/api/admin/artists/' + id, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'same-origin',
        body: JSON.stringify({
          name: $('aName').value.trim(),
          bornYear: $('aBornYear').value,
          bornCountry: $('aBornCountry').value.trim(),
          worksCity: $('aWorksCity').value.trim(),
          worksCountry: $('aWorksCountry').value.trim(),
          link: $('aLink').value.trim(),
          bio: $('aBio').value,
          cv: $('aCv').value
        })
      });
      if (!res.ok) throw new Error(res.status);
      var data = await res.json();
      artistsById[id] = data.artist;
      var opt = $('artistPick').querySelector('option[value="' + id + '"]');
      if (opt) opt.textContent = data.artist.name + (data.artist.published ? '' : '  (not public yet)');
      note.textContent = 'Saved ✓';
    } catch (e) {
      note.textContent = 'Could not save — try again.';
      note.style.color = '#b3261e';
    }
    btn.disabled = false; btn.textContent = 'Save changes';
  });

  load();
  loadArtists();
})();
</script>
</body>
</html>
