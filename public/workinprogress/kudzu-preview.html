document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

FF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Spectral';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"751ecf33-9c4d-432b-9896-0eb782393bc3\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>/* ═══════════════════════════════════════════════════════════════════\n   Kudzu Arts — Verdant design system\n   Deep plum-forest · cream · olive + gold · Spectral / Albert Sans.\n   Vines everywhere.\n   ═══════════════════════════════════════════════════════════════════ */\n\n:root {\n  --plum:      #1f1a26;\n  --plum-deep: #171320;\n  --plum-alt:  #2a2333;\n  --forest:    #26331f;\n  --forest-dp: #1d2718;\n  --cream:     #ece4d2;\n  --cream-sft: #cfc6b2;\n  --cream-dim: #a89e88;\n  --olive:     #8a8f43;\n  --olive-lt:  #aab26a;\n  --gold:      #c9ad6e;\n  --gold-dp:   #a98f52;\n  --line:      rgba(236, 228, 210, 0.16);\n  --line-soft: rgba(236, 228, 210, 0.10);\n\n  --serif: \"Spectral\", \"Cormorant Garamond\", Garamond, serif;\n  --sans:  \"Albert Sans\", system-ui, -apple-system, sans-serif;\n  --mono:  \"JetBrains Mono\", ui-monospace, monospace;\n\n  --maxw: 1280px;\n  --pad: 48px;\n  --pad-m: 22px;\n}\n\n*, *::before, *::after { box-sizing: border-box; }\nhtml { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }\nbody {\n  margin: 0;\n  background: var(--plum);\n  color: var(--cream);\n  font-family: var(--sans);\n  line-height: 1.5;\n  -webkit-font-smoothing: antialiased;\n  -moz-osx-font-smoothing: grayscale;\n  overflow-x: hidden;\n}\nimg, svg { display: block; max-width: 100%; }\na { color: inherit; }\nbutton { font-family: inherit; cursor: pointer; }\n::selection { background: var(--gold); color: var(--plum-deep); }\n\n/* ── Type primitives ─────────────────────────────────────────── */\n.eyebrow {\n  font-family: var(--mono);\n  font-size: 11px;\n  letter-spacing: 0.28em;\n  text-transform: uppercase;\n  color: var(--gold);\n  font-weight: 500;\n  display: inline-flex;\n  align-items: center;\n  gap: 12px;\n  margin: 0;\n}\n.eyebrow::before {\n  content: \"\";\n  width: 26px; height: 1px;\n  background: var(--gold);\n}\n.eyebrow.center { justify-content: center; }\n.eyebrow.bare::before { display: none; }\n\n.display {\n  font-family: var(--serif);\n  font-weight: 300;\n  letter-spacing: -0.02em;\n  line-height: 1.02;\n  color: var(--cream);\n  margin: 0;\n}\n.display em, .ital { font-style: italic; color: var(--gold); }\n\nh1, h2, h3, h4 { margin: 0; font-family: var(--serif); font-weight: 400; }\n\n.lede {\n  font-family: var(--serif);\n  font-size: clamp(17px, 1.7vw, 20px);\n  line-height: 1.6;\n  color: var(--cream-sft);\n}\n.mono-label {\n  font-family: var(--mono);\n  font-size: 11px;\n  letter-spacing: 0.18em;\n  text-transform: uppercase;\n}\n\n/* ── Layout ───────────────────────────────────────────────────── */\n.wrap { width: 100%; max-width: var(--maxw); margin-inline: auto; padding-inline: var(--pad); }\nsection { padding-block: clamp(72px, 10vw, 116px); position: relative; }\n.on-forest { background: var(--forest); }\n.on-plum-deep { background: var(--plum-deep); }\n.on-plum-alt { background: var(--plum-alt); }\n\n/* ── Buttons ──────────────────────────────────────────────────── */\n.btn {\n  display: inline-flex; align-items: center; gap: 10px;\n  padding: 14px 28px;\n  font-family: var(--sans); font-size: 14px; font-weight: 500;\n  letter-spacing: 0.04em; text-decoration: none;\n  border: 1px solid transparent; cursor: pointer;\n  transition: background .2s, color .2s, border-color .2s, transform .2s;\n}\n.btn-primary { background: var(--gold); color: var(--plum-deep); }\n.btn-primary:hover { background: var(--cream); transform: translateY(-1px); }\n.btn-ghost { background: transparent; color: var(--cream); border-color: var(--cream); }\n.btn-ghost:hover { background: var(--cream); color: var(--plum-deep); }\n.btn-olive { background: var(--olive); color: var(--plum-deep); }\n.btn-olive:hover { background: var(--olive-lt); transform: translateY(-1px); }\n\n/* ── Header / nav ─────────────────────────────────────────────── */\n.site-header {\n  position: sticky; top: 0; z-index: 60;\n  display: flex; align-items: center; justify-content: space-between;\n  padding: 18px var(--pad);\n  background: rgba(31, 26, 38, 0.86);\n  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);\n  border-bottom: 1px solid var(--line);\n}\n.brand { display: inline-flex; align-items: center; gap: 12px; text-decoration: none; }\n.brand .mark { width: 34px; height: 34px; flex: 0 0 auto; }\n.brand .word {\n  font-family: var(--serif); font-style: normal; font-size: 24px; color: var(--cream); letter-spacing: 0.04em;\n}\n.brand .word .arts {\n  font-style: normal; font-size: 12px; letter-spacing: 0.2em; text-transform: none;\n  color: var(--gold); margin-left: 5px;\n}\n.nav { display: flex; gap: 28px; font-size: 13px; letter-spacing: 0.04em; font-weight: 500; }\n.nav a { color: var(--cream); text-decoration: none; position: relative; padding-bottom: 4px; }\n.nav a::after {\n  content: \"\"; position: absolute; left: 0; bottom: 0; width: 100%; height: 1px;\n  background: var(--gold); transform: scaleX(0); transform-origin: left; transition: transform .25s;\n}\n.nav a:hover::after, .nav a[aria-current=\"page\"]::after { transform: scaleX(1); }\n.nav a[aria-current=\"page\"] { color: var(--gold); }\n.nav-cta { display: inline-flex; }\n.nav-toggle {\n  display: none; background: transparent; border: 1px solid var(--cream); color: var(--cream);\n  padding: 8px 14px; font-family: var(--sans); font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase;\n}\n\n/* ── Decorative vines ─────────────────────────────────────────── */\n.vine-climb {\n  position: absolute; top: 0; height: 100%; width: 200px;\n  background-repeat: no-repeat; background-size: contain;\n  pointer-events: none; opacity: 0.5; z-index: 0;\n}\n.vine-climb.left  { left: -30px;  background-image: url(\"c16f31a8-c6d7-49c6-b2b0-27d1801a2670\");  background-position: top left; }\n.vine-climb.right { right: -30px; background-image: url(\"490c9490-9551-47b7-bf1d-cd49ea11367c\"); background-position: top right; }\n\n.vine-divider {\n  width: 100%; max-width: 1200px; margin: 0 auto;\n  height: 70px;\n  background: url(\"407f19e2-ba96-4f46-b383-3bd67e9c0da3\") center / contain no-repeat;\n  opacity: 0.7;\n}\n.vine-corner {\n  position: absolute; width: 220px; height: 220px;\n  background: url(\"73cadd21-0a31-43c6-88f0-3ef00f194288\") no-repeat; background-size: contain;\n  pointer-events: none; opacity: 0.55; z-index: 0;\n}\n.vine-corner.tr { top: 0; right: 0; transform: scaleX(-1); }\n.vine-corner.tl { top: 0; left: 0; }\n.vine-corner.br { bottom: 0; right: 0; transform: scale(-1, -1); }\n.vine-corner.bl { bottom: 0; left: 0; transform: scaleY(-1); }\n\n.sprig {\n  width: 110px; height: 64px;\n  background: url(\"598880ff-bb50-43d2-b692-384a345a8d40\") center / contain no-repeat;\n  margin: 0 auto 8px;\n}\n.sprig.gold { background-image: url(\"fa5a13a3-ed49-43e1-b40a-405b46335bca\"); }\n\nsection > .wrap { position: relative; z-index: 1; }\n\n/* ── Hero ─────────────────────────────────────────────────────── */\n.hero { padding: 0 var(--pad); overflow: hidden; }\n.hero-grid {\n  display: grid; grid-template-columns: 1.05fr 0.95fr; gap: clamp(40px, 5vw, 64px);\n  align-items: center; min-height: 86vh; max-width: var(--maxw); margin-inline: auto;\n  position: relative; z-index: 1; padding-block: clamp(48px, 7vw, 80px);\n}\n.hero h1 {\n  font-family: var(--serif); font-weight: 300;\n  font-size: clamp(54px, 8vw, 92px); line-height: 1.0; letter-spacing: -0.02em; color: var(--cream);\n}\n.hero h1 .ital { color: var(--gold); font-style: italic; }\n.hero .lede { margin-top: 34px; max-width: 450px; }\n.hero-cta { display: flex; gap: 12px; margin-top: 42px; flex-wrap: wrap; }\n.hero-figure { position: relative; }\n.hero-badge {\n  position: absolute; bottom: -24px; left: -24px;\n  background: var(--olive); color: var(--plum-deep);\n  padding: 18px 22px; max-width: 210px;\n  font-family: var(--serif); font-size: 14px; line-height: 1.4;\n}\n.hero-badge .lbl {\n  font-family: var(--sans); font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase;\n  margin-bottom: 8px; opacity: 0.75;\n}\n\n/* ── Art placeholder blocks ───────────────────────────────────── */\n.art {\n  width: 100%; position: relative; overflow: hidden;\n  background: var(--plum-alt); display: flex; align-items: flex-end;\n}\n.art::before {\n  content: \"\"; position: absolute; inset: 0;\n  background:\n    radial-gradient(120% 90% at 30% 20%, rgba(255,255,255,0.08), transparent 60%),\n    radial-gradient(100% 80% at 80% 100%, rgba(0,0,0,0.22), transparent 70%);\n}\n.art .cap {\n  position: relative; padding: 12px 14px;\n  font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.16em; text-transform: uppercase;\n  color: rgba(236,228,210,0.5);\n}\n.art.t0 { background: #2f2738; } .art.t1 { background: #3a2f2a; }\n.art.t2 { background: #26331f; } .art.t3 { background: #473a2c; }\n.art.t4 { background: #2a3340; } .art.t5 { background: #4a3340; }\n.art.t6 { background: #3d4a3a; } .art.t7 { background: #534436; }\n.art.r-45 { aspect-ratio: 4/5; } .art.r-54 { aspect-ratio: 5/4; }\n.art.r-11 { aspect-ratio: 1/1; } .art.r-169 { aspect-ratio: 16/9; }\n.art.r-34 { aspect-ratio: 3/4; } .art.r-219 { aspect-ratio: 21/9; }\n.art.r-32 { aspect-ratio: 3/2; }\n\n/* ── Marquee ──────────────────────────────────────────────────── */\n.marquee {\n  border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);\n  padding: 22px 0; display: flex; gap: 28px; flex-wrap: wrap; justify-content: center;\n  font-family: var(--serif); font-style: italic; font-size: clamp(18px, 2.2vw, 22px); color: var( d { grid-template-columns: 1fr 1fr; }\n}\n@media (max-width: 560px) {\n  .services-grid { grid-template-columns: 1fr; }\n  .shop-grid { grid-template-columns: 1fr; }\n}\n<\u002Fstyle>\n<meta property=\"og:title\" content=\"Home · Kudzu Arts\">\n<meta property=\"og:description\" content=\"Kudzu Arts is a southern art practice and consultancy advocating for artists — advisory, curation, design, and cultural strategy. Based in Nashville and Los Angeles.\">\n<noscript><style>.reveal{opacity:1 !important;transform:none !important;}<\u002Fstyle><\u002Fnoscript>\n<\u002Fhead>\n<body>\n\n<header class=\"site-header\">\n  <a href=\"index.html\" class=\"brand\"><svg class=\"mark\" viewBox=\"0 0 48 48\" fill=\"none\" aria-hidden=\"true\">\n  <path d=\"M14 8 L14 40 M14 25 L31 8 M19 21 L33 40\" stroke=\"#ece4d2\" stroke-width=\"3.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath>\n  <path d=\"M14 33 C 9 31, 7 26, 11 22 C 14 19, 12 14, 16 12\" stroke=\"#8a8f43\" stroke-width=\"1.6\" stroke-linecap=\"round\"><\u002Fpath>\n  <ellipse cx=\"9.4\" cy=\"25.6\" rx=\"2.5\" ry=\"1.3\" transform=\"rotate(-38 9.4 25.6)\" fill=\"#8a8f43\"><\u002Fellipse>\n  <ellipse cx=\"13.2\" cy=\"14.6\" rx=\"2.3\" ry=\"1.2\" transform=\"rotate(30 13.2 14.6)\" fill=\"#8a8f43\"><\u002Fellipse>\n  <ellipse cx=\"12\" cy=\"20.5\" rx=\"2\" ry=\"1.1\" transform=\"rotate(-10 12 20.5)\" fill=\"#8a8f43\" opacity=\"0.7\"><\u002Fellipse>\n<\u002Fsvg><span class=\"word\">KUDZU<span class=\"arts\">arts<\u002Fspan><\u002Fspan><\u002Fa>\n  <nav class=\"nav\" aria-label=\"Primary\">\n    <a href=\"artists.html\">Artists<\u002Fa>\n    <a href=\"exhibitions.html\">Exhibitions<\u002Fa>\n    <a href=\"gallery.html\">Virtual Gallery<\u002Fa>\n    <a href=\"printshop.html\">Printshop<\u002Fa>\n    <a href=\"events.html\">Events<\u002Fa>\n    <a href=\"contact.html\">Contact<\u002Fa>\n  <\u002Fnav>\n  <a href=\"https://instagram.com/kudzu.arts\" target=\"_blank\" rel=\"noopener\" class=\"btn btn-olive nav-cta\">Follow on Instagram<\u002Fa>\n  <button class=\"nav-toggle\" type=\"button\" aria-expanded=\"false\">Menu<\u002Fbutton>\n<\u002Fheader>\n\n<section class=\"hero\">\n  <div class=\"vine-climb left\"><\u002Fdiv><div class=\"vine-climb right\"><\u002Fdiv>\n  <div class=\"hero-grid\">\n    <div class=\"reveal\">\n      <p class=\"eyebrow\">A southern art practice<\u002Fp>\n      <p style=\"font-family:var(--mono); font-size:11px; letter-spacing:0.24em; text-transform:none; color:var(--cream-dim); margin:14px 0 0; padding-left:76px;\">Nashville, TN &nbsp;·&nbsp; Los Angeles, CA<\u002Fp>\n      <h1 style=\"margin-top:26px\">Art that<br><span class=\"ital\">takes root<\u002Fspan><br>and spreads.<\u002Fh1>\n      <p class=\"lede\">An art consultancy advocating for artists — advisory, curation, design, and cultural strategy. Based in Nashville and Los Angeles, working with artists from across the country.<\u002Fp>\n      <p class=\"lede\" style=\"margin-top:18px; font-style:italic; color:var(--cream-dim); max-width:460px;\">Named for the green insistence of kudzu — for the way good things creep, climb, and eventually cover everything. Roots in southern cities across the country, tangled into one.<\u002Fp>\n      <div class=\"hero-cta\"><a href=\"#consultancy\" class=\"btn btn-primary\">What we do<\u002Fa><a href=\"artists.html\" class=\"btn btn-ghost\">The artists<\u002Fa><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"hero-figure reveal\" style=\"display:flex; flex-direction:column; align-items:center; justify-content:center; gap:30px;\">\n      <img src=\"4f53a7ab-70b1-4458-8e89-66544bda4aa1\" alt=\"Kudzu Arts — K monogram wrapped in kudzu vines\" style=\"width:min(82%,360px); height:auto;\">\n      <div style=\"text-align:center; font-family:var(--serif); font-style:italic; font-size:18px; color:var(--cream-sft);\">\n        <span style=\"display:block; font-family:var(--mono); font-style:normal; font-size:10px; letter-spacing:0.22em; text-transform:uppercase; color:var(--gold); margin-bottom:8px;\">Featured artist<\u002Fspan>\n        Ian Patrick Cato — Nashville &amp; Los Angeles\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n<section class=\"marquee\" aria-hidden=\"true\">\n  <span>Painting<\u002Fspan><span class=\"sep\">✻<\u002Fspan><span>Sculpture<\u002Fspan><span class=\"sep\">✻<\u002Fspan><span>Ceramics<\u002Fspan><span class=\"sep\">✻<\u002Fspan><span>Textile<\u002Fspan><span class=\"sep\">✻<\u002Fspan><span>Photography<\u002Fspan><span class=\"sep\">✻<\u002Fspan><span>Works on Paper<\u002Fspan><span class=\"sep\">✻<\u002Fspan><span>Printmaking<\u002Fspan><span class=\"sep\">✻<\u002Fspan><span>Installation<\u002Fspan><span class=\"sep\">✻<\u002Fspan><span>Web Design<\u002Fspan>\n<\u002Fsection>\n<section id=\"consultancy\" class=\"on-plum-alt reveal\">\n  <div class=\"vine-corner tl\"><\u002Fdiv><div class=\"vine-corner br\"><\u002Fdiv>\n  <div class=\"wrap\">\n    <div class=\"sec-head center\">\n      <div class=\"sprig gold\" aria-hidden=\"true\"><\u002Fdiv>\n      <p class=\"eyebrow center\">What we do<\u002Fp>\n      <h2>An art consultancy<br><em>advocating for artists.<\u002Fem><\u002Fh2>\n      <p class=\"lede\" style=\"max-width:640px; margin:22px auto 0;\">We work on behalf of the artists we believe in — guiding collectors, institutions, and brands while keeping the artist’s interest at the center of every decision. Based in Nashville and Los Angeles.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"services-grid\">\n      <div class=\"service\"><span class=\"no\">01<\u002Fspan><h3>Advisory<\u002Fh3><p>Collection-building and acquisition guidance for individuals, institutions, and corporate collections — from a first purchase to a considered holding.<\u002Fp><\u002Fdiv>\n      <div class=\"service\"><span class=\"no\">02<\u002Fspan><h3>Curation<\u002Fh3><p>Exhibitions, viewing rooms, and commissions — conceived, selected, and produced end to end across our cities and beyond.<\u002Fp><\u002Fdiv>\n      <div class=\"service\"><span class=\"no\">03<\u002Fspan><h3>Design<\u002Fh3><p>Identity, catalogues, and spatial design for artists and arts organizations — the visual language around the work.<\u002Fp><\u002Fdiv>\n      <div class=\"service\"><span class=\"no\">04<\u002Fspan><h3>Cultural Strategy<\u002Fh3><p>Positioning, partnerships, and press for artists and brands who want to build something with cultural weight, not just reach.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"text-align:center; margin-top:44px;\"><a href=\"contact.html\" class=\"btn btn-olive\">Work with us<\u002Fa><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n<section class=\"reveal artist-area\">\n  <!-- VINE PLACEHOLDERS · swap public/img/vine-*.svg with your custom vine art later -->\n  <div class=\"vine-corner tl\"><\u002Fdiv><div class=\"vine-corner tr\"><\u002Fdiv><div class=\"vine-corner bl\"><\u002Fdiv><div class=\"vine-corner br\"><\u002Fdiv>\n  <div class=\"wrap\">\n    <div class=\"sec-head sec-flex\"><div><p class=\"eyebrow\">Our artists<\u002Fp><h2>The <em>roster.<\u002Fem><\u002Fh2><\u002Fdiv><a href=\"artists.html\" class=\"link-arrow\">All artists →<\u002Fa><\u002Fdiv>\n    <div class=\"artist-grid\">\n      <a href=\"artist-ian-patrick-cato.html\" class=\"artist-card\"><div class=\"art t0 r-54\"><\u002Fdiv><div class=\"row\"><h3>Ian Patrick Cato<\u002Fh3><span class=\"loc\">NSH · LA<\u002Fspan><\u002Fdiv><div class=\"meta\">Painter &amp; ceramicist<\u002Fdiv><\u002Fa>\n      <a href=\"artist-jennie-lawless.html\" class=\"artist-card\"><div class=\"art t1 r-54\"><\u002Fdiv><div class=\"row\"><h3>Jennie Lawless<\u002Fh3><span class=\"loc\">LA<\u002Fspan><\u002Fdiv><div class=\"meta\">Painting<\u002Fdiv><\u002Fa>\n      <a href=\"artist-michael-haight.html\" class=\"artist-card\"><div class=\"art t2 r-54\"><\u002Fdiv><div class=\"row\"><h3>Michael Haight<\u002Fh3><span class=\"loc\">LA<\u002Fspan><\u002Fdiv><div class=\"meta\">Painting<\u002Fdiv><\u002Fa>\n      <a href=\"artist-evan-christof-seeling.html\" class=\"artist-card\"><div class=\"art t3 r-54\"><\u002Fdiv><div class=\"row\"><h3>Evan Christof Seeling<\u002Fh3><\u002Fdiv><div class=\"meta\">Glass<\u002Fdiv><\u002Fa>\n      <a href=\"artist-wyatt-mills.html\" class=\"artist-card\"><div class=\"art t4 r-54\"><\u002Fdiv><div class=\"row\"><h3>Wyatt Mills<\u002Fh3><span class=\"loc\">LA · Berlin<\u002Fspan><\u002Fdiv><div class=\"meta\">Painting<\u002Fdiv><\u002Fa>\n      <a href=\"artist-brandon-donahue-shipp.html\" class=\"artist-card\"><div class=\"art t5 r-54\"><\u002Fdiv><div class=\"row\"><h3>Brandon Donahue-Shipp<\u002Fh3><span class=\"loc\">NSH<\u002Fspan><\u002Fdiv><div class=\"meta\">Mixed media<\u002Fdiv><\u002Fa>\n      <a href=\"artist-katya-labowe-stoll.html\" class=\"artist-card\"><div class=\"art t6 r-54\"><\u002Fdiv><div class=\"row\"><h3>Katya Labowe-Stoll<\u002Fh3><span class=\"loc\">LA<\u002Fspan><\u002Fdiv><div class=\"meta\">Painting &amp; drawing<\u002Fdiv><\u002Fa>\n      <a href=\"artist-talia-ceravolo.html\" class=\"artist-card\"><div class=\"art t7 r-54\"><\u002Fdiv><div class=\"row\"><h3>Talia Ceravolo<\u002Fh3><span class=\"loc\">LA<\u002Fspan><\u002Fdiv><div class=\"meta\">Oil painting<\u002Fdiv><\u002Fa>\n      <a href=\"artist-marta-lee.html\" class=\"artist-card\"><div class=\"art t8 r-54\"><\u002Fdiv><div class=\"row\"><h3>Marta Lee<\u002Fh3><span class=\"loc\">NY<\u002Fspan><\u002Fdiv><div class=\"meta\">Painting<\u002Fdiv><\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n<div class=\"vine-divider\" aria-hidden=\"true\"><\u002Fdiv>\n<section class=\"on-forest reveal\">\n  <div class=\"vine-corner tr\"><\u002Fdiv>\n  <div class=\"wrap\">\n    <div class=\"sec-head center\"><div class=\"sprig gold\" aria-hidden=\"true\"><\u002Fdiv><p class=\"eyebrow center\">Around the country<\u002Fp><h2>Where our artists <em>show.<\u002Fem><\u002Fh2><\u002Fdiv>\n    <div class=\"show-grid\">\n      <a href=\"exhibitions.html\" class=\"show-card\"><div class=\"art t3 r-169\"><\u002Fdiv><div class=\"top\"><h3>Wyatt Mills<\u002Fh3><span class=\"status on\">2025<\u002Fspan><\u002Fdiv><div class=\"sub\"><span>The Mud, The Sky, and the 395 — la BEAST Gallery<\u002Fspan><span>Los Angeles<\u002Fspan><\u002Fdiv><\u002Fa>      <a href=\"exhibitions.html\" class=\"show-card\"><div class=\"art t4 r-169\"><\u002Fdiv><div class=\"top\"><h3>Michael Haight<\u002Fh3><span class=\"status on\">2023<\u002Fspan><\u002Fdiv><div class=\"sub\"><span>Daydream Jelly — la BEAST Gallery<\u002Fspan><span>Los Angeles<\u002Fspan><\u002Fdiv><\u002Fa>      <a href=\"exhibitions.html\" class=\"show-card\"><div class=\"art t5 r-169\"><\u002Fdiv><div class=\"top\"><h3>Ian Patrick Cato<\u002Fh3><span class=\"status on\">2020<\u002Fspan><\u002Fdiv><div class=\"sub\"><span>Group exhibition — Blum &amp; Poe<\u002Fspan><span>Los Angeles<\u002Fspan><\u002Fdiv><\u002Fa>      <a href=\"exhibitions.html\" class=\"show-card\"><div class=\"art t6 r-169\"><\u002Fdiv><div class=\"top\"><h3>Katya Labowe-Stoll<\u002Fh3><span class=\"status on\">—<\u002Fspan><\u002Fdiv><div class=\"sub\"><span>Waters of Pure Reason — Make Room<\u002Fspan><span>Los Angeles<\u002Fspan><\u002Fdiv><\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n<section class=\"reveal\">\n  <div class=\"wrap\">\n    <div class=\"sec-head center\"><div class=\"sprig gold\" aria-hidden=\"true\"><\u002Fdiv><p class=\"eyebrow center\">Acquire<\u002Fp><h2>Take something <em>home.<\u002Fem><\u002Fh2><\u002Fdiv>\n    <div class=\"show-grid\">\n      <a href=\"gallery.html\" class=\"show-card\"><div class=\"art t4 r-169\"><span class=\"tag\">For sale<\u002Fspan><\u002Fdiv><div class=\"top\"><h3>Virtual Gallery<\u002Fh3><span class=\"status on\">Available now<\u002Fspan><\u002Fdiv><div class=\"sub\"><span>A curated selection of works for sale<\u002Fspan><span>Enter the viewing room →<\u002Fspan><\u002Fdiv><\u002Fa>\n      <a href=\"printshop.html\" class=\"show-card\"><div class=\"art t7 r-169\"><span class=\"tag\">Limited editions<\u002Fspan><\u002Fdiv><div class=\"top\"><h3>Printshop<\u002Fh3><span class=\"status on\">Signed &amp; numbered<\u002Fspan><\u002Fdiv><div class=\"sub\"><span>Limited-edition prints by our artists<\u002Fspan><span>Shop prints →<\u002Fspan><\u002Fdiv><\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n<section class=\"reveal\">\n  <div class=\"wrap\">\n    <div class=\"sec-head center\"><div class=\"sprig\" aria-hidden=\"true\"><\u002Fdiv><p class=\"eyebrow center\">Upcoming<\u002Fp><h2>Events &amp; <em>workshops.<\u002Fem><\u002Fh2><\u002Fdiv>\n    <div class=\"events\">\n      <div style=\"text-align:center; padding:40px 0;\">\n        <p class=\"lede\" style=\"max-width:520px; margin:0 auto; font-style:italic;\">Our 2026 calendar of openings, talks, studio visits, and workshops is taking shape — in Nashville, Los Angeles, and beyond. Join the newsletter and we’ll let you know first.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"text-align:center; margin-top:44px;\"><a href=\"events.html\" class=\"btn btn-ghost\">All events &amp; workshops →<\u002Fa><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n<section class=\"on-plum-deep reveal\" style=\"text-align:center;\">\n  <div class=\"vine-climb left\"><\u002Fdiv><div class=\"vine-climb right\"><\u002Fdiv>\n  <div class=\"wrap\" style=\"max-width:720px;\">\n    <div class=\"sprig gold\" aria-hidden=\"true\"><\u002Fdiv>\n    <p class=\"eyebrow center\">Find us<\u002Fp>\n    <h2 class=\"display\" style=\"font-size:clamp(40px,6vw,64px); margin-top:20px;\">From all over<br>the South,<br><span class=\"ital\">one tangled root.<\u002Fspan><\u002Fh2>\n    <p class=\"lede\" style=\"margin:28px auto 36px; max-width:520px;\">We don’t keep a front desk — we keep a calendar. Catch us at events and workshops across our cities, or write ahead and we’ll point you to what’s near you.<\u002Fp>\n    <a href=\"contact.html\" class=\"btn btn-primary\">Get in touch<\u002Fa>\n  <\u002Fdiv>\n<\u002Fsection>\n<footer class=\"site-footer\">\n  <div class=\"vine-corner br\"><\u002Fdiv>\n  <div class=\"footer-grid\">\n    <div class=\"footer-brand\">\n      <a href=\"index.html\" class=\"brand\"><svg class=\"mark\" viewBox=\"0 0 48 48\" fill=\"none\" aria-hidden=\"true\">\n  <path d=\"M14 8 L14 40 M14 25 L31 8 M19 21 L33 40\" stroke=\"#ece4d2\" stroke-width=\"3.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath>\n  <path d=\"M14 33 C 9 31, 7 26, 11 22 C 14 19, 12 14, 16 12\" stroke=\"#8a8f43\" stroke-width=\"1.6\" stroke-linecap=\"round\"><\u002Fpath>\n  <ellipse cx=\"9.4\" cy=\"25.6\" rx=\"2.5\" ry=\"1.3\" transform=\"rotate(-38 9.4 25.6)\" fill=\"#8a8f43\"><\u002Fellipse>\n  <ellipse cx=\"13.2\" cy=\"14.6\" rx=\"2.3\" ry=\"1.2\" transform=\"rotate(30 13.2 14.6)\" fill=\"#8a8f43\"><\u002Fellipse>\n  <ellipse cx=\"12\" cy=\"20.5\" rx=\"2\" ry=\"1.1\" transform=\"rotate(-10 12 20.5)\" fill=\"#8a8f43\" opacity=\"0.7\"><\u002Fellipse>\n<\u002Fsvg><span class=\"word\">KUDZU<span class=\"arts\">arts<\u002Fspan><\u002Fspan><\u002Fa>\n      <p class=\"blurb\"><em>A southern art practice rooted in southern cities across the country, climbing everywhere it can.<\u002Fem><\u002Fp>\n    <\u002Fdiv>\n    <div class=\"footer-col\"><h4>Cities<\u002Fh4><p>Nashville<\u002Fp><p>Los Angeles<\u002Fp><p>Austin<\u002Fp><p>Miami<\u002Fp><p>Savannah<\u002Fp><\u002Fdiv>\n    <div class=\"footer-col\"><h4>Explore<\u002Fh4><a href=\"artists.html\">Artists<\u002Fa><a href=\"exhibitions.html\">Exhibitions<\u002Fa><a href=\"gallery.html\">Virtual Gallery<\u002Fa><a href=\"printshop.html\">Printshop<\u002Fa><a href=\"events.html\">Events &amp; Workshops<\u002Fa><\u002Fdiv>\n    <div class=\"footer-col\"><h4>Connect<\u002Fh4><a href=\"https://instagram.com/kudzu.arts\" target=\"_blank\" rel=\"noopener\">Instagram<\u002Fa><a href=\"contact.html\">Newsletter<\u002Fa><a href=\"mailto:info@kudzuarts.com\">info@kudzuarts.com<\u002Fa><\u002Fdiv>\n  <\u002Fdiv>\n  <div cla
