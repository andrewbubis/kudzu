<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin · Kudzu Arts</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#fbfaf7">
<link rel="icon" href="img/logo-k.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/v3.css">
<link rel="stylesheet" href="css/account.css">
<style>
.adm { max-width: 940px; margin: 0 auto; padding: 32px 20px 80px; }
.adm-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 32px; gap: 16px; flex-wrap: wrap; }
.adm-head h1 { margin: 0; font-size: 22px; }
.adm-stats { display: flex; gap: 24px; flex-wrap: wrap; }
.adm-stat { text-align: center; }
.adm-stat .n { display: block; font-size: 28px; font-weight: 600; line-height: 1; }
.adm-stat .l { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--a-soft); margin-top: 3px; }
.adm-artist { border: 1px solid var(--a-line); border-radius: 6px; margin-bottom: 12px; overflow: hidden; }
.adm-artist-row { display: grid; grid-template-columns: 1fr auto auto auto; gap: 16px; align-items: center; padding: 16px 20px; cursor: pointer; user-select: none; }
.adm-artist-row:hover { background: var(--a-bg); }
.adm-artist-name { font-weight: 600; font-size: 15px; }
.adm-artist-email { font-size: 12px; color: var(--a-soft); margin-top: 2px; }
.adm-chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; padding: 2px 8px; border-radius: 20px; border: 1px solid; white-space: nowrap; }
.chip.ok  { color: #2e7d32; border-color: #a5d6a7; background: #f1f8f1; }
.chip.no  { color: #b71c1c; border-color: #ef9a9a; background: #fdf1f1; }
.chip.dim { color: var(--a-soft); border-color: var(--a-line); background: transparent; }
.adm-counts { display: flex; gap: 12px; font-size: 13px; white-space: nowrap; }
.adm-counts span { color: var(--a-soft); }
.adm-counts strong { color: var(--a-ink); }
.adm-toggle { font-size: 18px; color: var(--a-soft); transition: transform .15s; }
.adm-artist.open .adm-toggle { transform: rotate(180deg); }
.adm-detail { display: none; border-top: 1px solid var(--a-line); padding: 20px; }
.adm-artist.open .adm-detail { display: block; }
.adm-detail-meta { display: flex; gap: 32px; flex-wrap: wrap; margin-bottom: 20px; font-size: 13px; }
.adm-detail-meta dt { color: var(--a-soft); font-size: 11px; text-transform: uppercase; letter-spacing:.06em; }
.adm-detail-meta dd { margin: 0; }
.adm-works-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px,1fr)); gap: 12px; }
.adm-work { border: 1px solid var(--a-line); border-radius: 4px; overflow: hidden; font-size: 12px; }
.adm-work img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; background: var(--a-bg); }
.adm-work .adm-work-info { padding: 8px; }
.adm-work .adm-work-title { font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.adm-work .adm-work-meta { color: var(--a-soft); margin-top: 2px; }
.adm-work .adm-work-status { display: inline-block; font-size: 10px; text-transform: uppercase; letter-spacing:.06em; padding: 1px 6px; border-radius: 3px; margin-top: 4px; }
.status-published { background: #e8f5e9; color: #2e7d32; }
.status-draft     { background: #fff3e0; color: #e65100; }
.status-sold      { background: #ede7f6; color: #4527a0; }
.adm-section-label { font-size: 12px; text-transform: uppercase; letter-spacing:.08em; color: var(--a-soft); margin: 0 0 10px; }
.adm-empty { color: var(--a-soft); font-size: 13px; font-style: italic; }
.adm-photos-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
.adm-photos-row img { width: 80px; height: 80px; object-fit: cover; border-radius: 4px; border: 1px solid var(--a-line); }
.adm-link { font-size: 12px; color: var(--a-link); text-decoration: underline; }
.adm-loading { color: var(--a-soft); font-size: 13px; font-style: italic; }
/* analytics panel */
/* ── Analytics summary bar ── */
.adm-an-bar { display: flex; align-items: center; gap: 0; background: var(--a-bg); border: 1px solid var(--a-line); border-radius: 8px; padding: 14px 20px; margin-bottom: 12px; flex-wrap: wrap; gap: 4px; }
.adm-an-bar-stats { display: flex; gap: 24px; flex: 1; flex-wrap: wrap; }
.adm-an-stat { display: flex; flex-direction: column; }
.adm-an-stat .n { font-size: 22px; font-weight: 700; line-height: 1; }
.adm-an-stat .l { font-size: 10px; text-transform: uppercase; letter-spacing:.07em; color: var(--a-soft); margin-top: 2px; }
.adm-an-bar-spark { display: flex; align-items: flex-end; gap: 2px; height: 28px; width: 80px; flex-shrink: 0; margin: 0 16px; }
.adm-an-bar-spark .b { flex: 1; background: var(--a-link); border-radius: 1px 1px 0 0; opacity: 0.55; min-width: 2px; }
.adm-an-toggle { font-size: 12px; color: var(--a-link); background: none; border: 1px solid var(--a-line); border-radius: 4px; padding: 5px 12px; cursor: pointer; white-space: nowrap; flex-shrink: 0; }
.adm-an-toggle:hover { background: var(--a-line); }
/* ── Analytics detail panel ── */
.adm-an-detail { display: none; background: var(--a-bg); border: 1px solid var(--a-line); border-radius: 8px; padding: 20px 24px; margin-bottom: 20px; }
.adm-an-detail.open { display: block; }
.adm-an-section { margin-bottom: 24px; }
.adm-an-section:last-child { margin-bottom: 0; }
.adm-an-section-title { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--a-soft); margin: 0 0 12px; }
.adm-sparkline { display: flex; align-items: flex-end; gap: 3px; height: 52px; }
.adm-spark-bar { flex: 1; min-width: 3px; background: var(--a-link); border-radius: 2px 2px 0 0; opacity: 0.65; cursor: default; }
.adm-spark-bar:hover { opacity: 1; }
/* filter tabs */
.adm-an-tabs { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
.adm-an-tab { font-size: 12px; padding: 4px 12px; border: 1px solid var(--a-line); border-radius: 20px; background: none; cursor: pointer; color: var(--a-soft); }
.adm-an-tab.active { background: var(--a-ink); color: #fff; border-color: var(--a-ink); }
/* top pages table */
.adm-top-pages { font-size: 12px; }
.adm-top-pages table { width: 100%; border-collapse: collapse; }
.adm-top-pages td, .adm-top-pages th { padding: 5px 8px; text-align: left; border-bottom: 1px solid var(--a-line); }
.adm-top-pages th { font-size: 10px; text-transform: uppercase; letter-spacing: .07em; color: var(--a-soft); border-bottom: 2px solid var(--a-line); }
.adm-top-pages .views-col { text-align: right; font-weight: 600; white-space: nowrap; width: 60px; }
.adm-top-pages .bar-col { width: 120px; padding-right: 12px; }
.adm-page-bar { height: 6px; background: var(--a-link); border-radius: 3px; opacity: 0.55; }
/* artist views list */
.adm-av-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px,1fr)); gap: 8px; }
.adm-av-item { display: flex; justify-content: space-between; align-items: center; background: #fff; border: 1px solid var(--a-line); border-radius: 4px; padding: 8px 12px; font-size: 12px; }
.adm-av-item .name { font-weight: 600; }
.adm-av-item .cnt { color: var(--a-soft); white-space: nowrap; }
/* location list */
.adm-locations { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px,1fr)); gap: 6px; }
.adm-loc { background: #fff; border: 1px solid var(--a-line); border-radius: 4px; padding: 8px 12px; font-size: 12px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.adm-loc-place { min-width: 0; }
.adm-loc-city { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.adm-loc-region { color: var(--a-soft); font-size: 11px; }
.adm-loc-cnt { white-space: nowrap; color: var(--a-soft); font-size: 11px; flex-shrink: 0; }
/* referrer sources */
.adm-sources { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px,1fr)); gap: 8px; }
.adm-source { background: #fff; border: 1px solid var(--a-line); border-radius: 4px; padding: 10px 14px; font-size: 12px; display: flex; align-items: center; gap: 10px; }
.adm-source-icon { font-size: 18px; flex-shrink: 0; }
.adm-source-info { flex: 1; min-width: 0; }
.adm-source-name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.adm-source-bar-wrap { height: 4px; background: var(--a-line); border-radius: 2px; margin-top: 4px; }
.adm-source-bar { height: 4px; background: var(--a-link); border-radius: 2px; opacity: 0.65; }
.adm-source-cnt { font-size: 11px; color: var(--a-soft); margin-left: auto; white-space: nowrap; padding-left: 8px; flex-shrink: 0; }
/* artist detail header */
.adm-artist-header { display: flex; gap: 20px; align-items: flex-start; margin-bottom: 20px; }
.adm-artist-avatar { width: 72px; height: 72px; border-radius: 50%; object-fit: cover; border: 1px solid var(--a-line); flex-shrink: 0; background: var(--a-bg); }
.adm-artist-header-info { flex: 1; }
.adm-artist-header-info h3 { margin: 0 0 4px; font-size: 16px; }
.adm-artist-header-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
/* cv block */
.adm-cv-text { font-size: 12px; line-height: 1.65; white-space: pre-wrap; color: var(--a-ink); background: var(--a-bg); border: 1px solid var(--a-line); border-radius: 4px; padding: 12px; max-height: 200px; overflow-y: auto; margin: 0 0 20px; }
/* contract badge */
.adm-contract { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; border: 1px solid; padding: 3px 10px; border-radius: 20px; margin-bottom: 16px; }
.adm-contract.signed { color: #2e7d32; border-color: #a5d6a7; background: #f1f8f1; }
.adm-contract.unsigned { color: #b71c1c; border-color: #ef9a9a; background: #fdf1f1; }
/* stats row */
.adm-portfolio-stats { display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 20px; padding: 12px 16px; background: var(--a-bg); border-radius: 6px; border: 1px solid var(--a-line); }
.adm-ps { text-align: center; }
.adm-ps .n { display: block; font-size: 18px; font-weight: 700; line-height: 1; }
.adm-ps .l { display: block; font-size: 10px; text-transform: uppercase; letter-spacing: .07em; color: var(--a-soft); margin-top: 2px; }
/* work card price */
.adm-work-price { font-weight: 600; color: var(--a-ink); }
.adm-work-dim { color: var(--a-soft); font-size: 11px; }
</style>
</head>
<body>

<header class="site-header">
  <a href="index.html" class="brand"><img class="mark" src="img/logo-k.png" alt="" aria-hidden="true"><span class="word"><b>KUDZU</b><span class="arts">arts</span></span></a>
  <nav class="nav" aria-label="Primary">
    <a href="artists.html">Artists</a>

  <div class="acct-menu" data-open="false" id="acctMenu">

      <span id="acctMenuName">account</span>

<div class="adm" id="analyticsPanel" style="display:none;">
  <!-- Summary bar (always visible) -->
  <div class="adm-an-bar" id="anBar">
    <div class="adm-an-bar-stats" id="anStats"><p class="adm-loading" style="margin:0;">Loading analytics…</p></div>
    <div class="adm-an-bar-spark" id="anMiniSpark"></div>
    <button class="adm-an-toggle" id="anToggle" onclick="(function(){var d=document.getElementById('anDetail');var open=d.classList.toggle('open');document.getElementById('anToggle').textContent=open?'▴ Less detail':'▾ More detail';})()">▾ More detail</button>
  </div>
  <!-- Expandable detail panel -->
  <div class="adm-an-detail" id="anDetail">
    <div id="analyticsContent"><p class="adm-loading">Loading…</p></div>
  </div>
</div>
<main class="adm" id="main">
  <p style="color:var(--a-soft);font-style:italic;">Loading…</p>
</main>

<script src="js/account.js" defer></script>
<script>
(function () {
  function img(path, alt) {
    if (!path) return '<div style="width:100%;aspect-ratio:1;background:var(--a-bg);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--a-soft);">no image</div>';
    return '<img src="' + path + '" alt="' + esc(alt || '') + '" loading="lazy">';
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function chip(label, ok) {
    return '<span class="chip ' + (ok ? 'ok' : 'no') + '">' + (ok ? '✓' : '✗') + ' ' + esc(label) + '</span>';
  }

  function fmt(dateStr) {
    if (!dateStr) return '—';
    return new Date(dateStr).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  }

  function price(cents) {
    if (!cents) return '—';
    return '$' + (cents / 100).toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  }

  async function loadDetail(artistId, container) {
    container.innerHTML = '<p class="adm-loading">Loading…</p>';
    try {
      var r = await fetch('/api/admin/artists/' + artistId + '/works', { credentials: 'same-origin' });
      if (!r.ok) throw new Error('failed');
      var data = await r.json();
      var a = data.artist;
      var works = data.works || [];
      var photos = data.photos || [];
      var books = data.books || [];
      var agreements = data.agreements || [];

      var html = '';

      // ── Artist header (photo + key links) ─────────────────────────
      html += '<div class="adm-artist-header">';
      if (a.photo) {
        html += '<img class="adm-artist-avatar" src="' + esc(a.photo) + '" alt="' + esc(a.name) + '">';
      } else {
        html += '<div class="adm-artist-avatar" style="display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--a-soft);">no photo</div>';
      }
      html += '<div class="adm-artist-header-info">';
      html += '<h3>' + esc(a.name) + '</h3>';
      html += '<div style="font-size:12px;color:var(--a-soft);">' + esc(a.email) + '</div>';
      html += '<div class="adm-artist-header-actions">';
      html += '<a class="adm-link" href="/workinprogress/' + esc(a.slug) + '.html" target="_blank">public page ↗</a>';
      html += ' &ensp;<a class="adm-link" href="/workinprogress/profile.html" target="_blank">edit profile</a>';
      if (a.link) html += ' &ensp;<a class="adm-link" href="' + esc(a.link) + '" target="_blank" rel="noopener">website ↗</a>';
      html += '</div></div></div>';

      // ── Profile details table ──────────────────────────────────────
      html += '<div class="adm-detail-meta">';
      html += '<div><dt>Joined</dt><dd>' + esc(fmt(a.joinedAt || a.createdAt)) + '</dd></div>';
      html += '<div><dt>Location</dt><dd>' + esc([a.worksCity, a.worksCountry].filter(Boolean).join(', ') || '—') + '</dd></div>';
      if (a.bornYear || a.bornCountry) {
        html += '<div><dt>Born</dt><dd>' + esc([a.bornYear, a.bornCountry].filter(Boolean).join(', ')) + '</dd></div>';
      }
      if (a.notifyPhone) {
        html += '<div><dt>Phone</dt><dd>' + esc(a.notifyPhone) + ' <span style="color:var(--a-soft);font-size:11px;">(' + esc(a.notifyChannel || 'email') + ')</span></dd></div>';
      }
      html += '<div><dt>Stripe</dt><dd>' + (a.stripeConnected ? '<span style="color:#2e7d32;">✓ connected</span>' : '<span style="color:#b71c1c;">✗ not connected</span>') + '</dd></div>';
      html += '</div>';

      // ── Contract / agreement status ────────────────────────────────
      if (agreements.length) {
        var ag = agreements[0];
        html += '<div class="adm-contract signed">✓ Contract signed — ' + esc(ag.version || 'v1') + ' · ' + esc(fmt(ag.signedAt)) + ' · ' + esc(ag.legalName || a.name) + '</div>';
        if (ag.address) {
          html += '<p style="font-size:12px;color:var(--a-soft);margin:0 0 16px;padding-left:2px;">' + esc(ag.address).replace(/\n/g,'<br>') + '</p>';
        }
      } else {
        html += '<div class="adm-contract unsigned">✗ No contract on file</div><br>';
      }

      // ── Portfolio stats ────────────────────────────────────────────
      var totalValue = works.reduce(function(s,w){ return s + (w.priceCents || 0); }, 0);
      var forSale = works.filter(function(w){ return w.forSale && w.status !== 'sold'; }).length;
      var hasDims = works.filter(function(w){ return w.shipWeightOz; }).length;
      html += '<div class="adm-portfolio-stats">';
      html += '<div class="adm-ps"><span class="n">' + works.length + '</span><span class="l">Works</span></div>';
      html += '<div class="adm-ps"><span class="n">' + forSale + '</span><span class="l">For Sale</span></div>';
      html += '<div class="adm-ps"><span class="n">' + works.filter(function(w){return w.status==='published';}).length + '</span><span class="l">Published</span></div>';
      html += '<div class="adm-ps"><span class="n">' + works.filter(function(w){return w.status==='sold';}).length + '</span><span class="l">Sold</span></div>';
      html += '<div class="adm-ps"><span class="n">' + (totalValue ? '$' + (totalValue/100).toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g,',') : '—') + '</span><span class="l">Portfolio Value</span></div>';
      html += '<div class="adm-ps"><span class="n">' + photos.length + '</span><span class="l">Studio Photos</span></div>';
      html += '<div class="adm-ps"><span class="n">' + books.length + '</span><span class="l">Books</span></div>';
      var pgViews = (window._kudzuArtistViews || {})[a.slug] || 0;
      html += '<div class="adm-ps"><span class="n">' + (pgViews || '—') + '</span><span class="l">Page Views <span style="font-weight:400;font-size:9px;">(30d)</span></span></div>';
      html += '</div>';

      // ── Bio ────────────────────────────────────────────────────────
      html += '<p class="adm-section-label">Bio</p>';
      if (a.bio && a.bio.trim()) {
        html += '<p style="font-size:13px;line-height:1.6;margin:0 0 20px;max-width:640px;">' + esc(a.bio).replace(/\n/g,'<br>') + '</p>';
      } else {
        html += '<p class="adm-empty" style="margin-bottom:20px;">No bio entered.</p>';
      }

      // ── CV / Artist Statement ──────────────────────────────────────
      html += '<p class="adm-section-label">CV / Artist Statement</p>';
      if (a.cv && a.cv.trim()) {
        html += '<pre class="adm-cv-text">' + esc(a.cv) + '</pre>';
      } else {
        html += '<p class="adm-empty" style="margin-bottom:20px;">No CV entered.</p>';
      }

      // ── Artworks ──────────────────────────────────────────────────
      html += '<p class="adm-section-label">Artworks (' + works.length + ')</p>';
      if (works.length) {
        html += '<div class="adm-works-grid">';
        works.forEach(function (w) {
          var meta = [w.year, w.medium].filter(Boolean).join(' · ');
          html += '<div class="adm-work">' + img(w.image, w.title) +
            '<div class="adm-work-info">' +
              '<div class="adm-work-title">' + esc(w.title || 'Untitled') + '</div>' +
              (meta ? '<div class="adm-work-meta">' + esc(meta) + '</div>' : '') +
              (w.dimensions ? '<div class="adm-work-dim">' + esc(w.dimensions) + '</div>' : '') +
              '<div class="adm-work-meta adm-work-price">' + price(w.priceCents) + (w.forSale ? '' : ' <span style="color:var(--a-soft);font-weight:400;">(not for sale)</span>') + '</div>' +
              '<span class="adm-work-status status-' + esc(w.status) + '">' + esc(w.status) + '</span>' +
            '</div></div>';
        });
        html += '</div>';
      } else {
        html += '<p class="adm-empty">No artworks uploaded yet.</p>';
      }

      // ── Studio / Gallery photos ────────────────────────────────────
      if (photos.length) {
        html += '<p class="adm-section-label" style="margin-top:24px;">Studio & Gallery Photos (' + photos.length + ')</p>';
        html += '<div class="adm-photos-row">';
        photos.forEach(function (p) {
          html += '<a href="' + esc(p.image) + '" target="_blank" rel="noopener">' +
            '<img src="' + esc(p.image) + '" alt="' + esc(p.caption || '') + '" loading="lazy" title="' + esc(p.caption || 'Studio photo') + '"></a>';
        });
        html += '</div>';
      }

      // ── Books / Publications ───────────────────────────────────────
      if (books.length) {
        html += '<p class="adm-section-label" style="margin-top:24px;">Books & Publications (' + books.length + ')</p>';
        html += '<div class="adm-works-grid">';
        books.forEach(function (b) {
          html += '<div class="adm-work">' + img(b.image, b.title) +
            '<div class="adm-work-info">' +
              '<div class="adm-work-title">' + esc(b.title || 'Untitled') + '</div>' +
              '<div class="adm-work-meta">' + esc([b.year, b.publisher].filter(Boolean).join(' · ')) + '</div>' +
              (b.edition ? '<div class="adm-work-dim">' + esc(b.edition) + '</div>' : '') +
              (b.priceCents ? '<div class="adm-work-meta adm-work-price">' + price(b.priceCents) + '</div>' : '') +
            '</div></div>';
        });
        html += '</div>';
      }

      container.innerHTML = html;
    } catch (e) {
      container.innerHTML = '<p class="adm-empty">Could not load details.</p>';
    }
  }

  window.addEventListener('DOMContentLoaded', async function () {
    try {
      var [meRes, rosterRes] = await Promise.all([
        fetch('/api/me', { credentials: 'same-origin' }),
        fetch('/api/admin/roster', { credentials: 'same-origin' })
      ]);
      if (!meRes.ok) { location.href = 'login.html'; return; }
      var meData = await meRes.json();
      if (!meData.artist || !meData.artist.isAdmin) { location.href = 'profile.html'; return; }
      var adminDashEl = document.getElementById('adminDash');
      if (adminDashEl) adminDashEl.hidden = false;
      var acctNameEl = document.getElementById('acctMenuName');
      if (acctNameEl) acctNameEl.textContent = (meData.artist.name || 'account').split(' ')[0].toLowerCase();
      if (!rosterRes.ok) throw new Error('roster failed');
      var roster = await rosterRes.json();

      var artists = roster.artists || [];
      var totalWorks = artists.reduce(function (s, a) { return s + a.published + a.drafts; }, 0);
      var totalPublished = artists.reduce(function (s, a) { return s + a.published; }, 0);
      var totalSold = artists.reduce(function (s, a) { return s + a.sold; }, 0);

      var html = '<div class="adm-head">' +
        '<h1>Artist Roster</h1>' +
        '<div class="adm-stats">' +
          '<div class="adm-stat"><span class="n">' + artists.length + '</span><span class="l">Artists</span></div>' +
          '<div class="adm-stat"><span class="n">' + totalWorks + '</span><span class="l">Works</span></div>' +
          '<div class="adm-stat"><span class="n">' + totalPublished + '</span><span class="l">Published</span></div>' +
          '<div class="adm-stat"><span class="n">' + totalSold + '</span><span class="l">Sold</span></div>' +
        '</div>' +
      '</div>';

      artists.forEach(function (a, i) {
        html += '<div class="adm-artist" id="artist-' + esc(a.id) + '">' +
          '<div class="adm-artist-row" data-id="' + esc(a.id) + '">' +
            '<div>' +
              '<div class="adm-artist-name">' + esc(a.name) + (a.isAdmin ? ' <span class="chip dim" style="font-size:10px;">admin</span>' : '') + '</div>' +
              '<div class="adm-artist-email">' + esc(a.email) + '</div>' +
            '</div>' +
            '<div class="adm-chips">' +
              chip('photo', a.has.photo) +
              chip('bio', a.has.bio) +
              chip('cv', a.has.cv) +
              chip('stripe', a.has.stripe) +
            '</div>' +
            '<div class="adm-counts">' +
              '<div><strong>' + a.published + '</strong> <span>pub</span></div>' +
              '<div><strong>' + a.drafts + '</strong> <span>draft</span></div>' +
              '<div><strong>' + a.sold + '</strong> <span>sold</span></div>' +
              '<div><span id="av-' + esc(a.slug) + '" title="page views last 30 days" style="display:inline-flex;align-items:center;gap:3px;cursor:default;"><span style="font-size:11px;opacity:.55;">👁</span> <strong>—</strong> <span>views</span></span></div>' +
            '</div>' +
            '<span class="adm-toggle">▾</span>' +
          '</div>' +
          '<div class="adm-detail" id="detail-' + esc(a.id) + '"></div>' +
        '</div>';
      });

      document.getElementById('main').innerHTML = html;

      // Load analytics panel
      document.getElementById('analyticsPanel').style.display = 'block';
      (async function loadAnalytics() {
        try {
          var ar = await fetch('/api/admin/analytics', { credentials: 'same-origin' });
          if (!ar.ok) throw new Error();
          var an = await ar.json();
          var t = an.totals || {};
          var topPages = an.topPages || [];
          var daily = an.daily || [];
          var artistViews = an.artistViews || [];
          var maxViews = topPages[0] ? Number(topPages[0].views) : 1;
          var maxDay = daily.reduce(function(m,d){ return Math.max(m, Number(d.views)); }, 1);

          // ── Summary bar ───────────────────────────────────────────
          var statsHtml = '';
          statsHtml += '<div class="adm-an-stat"><span class="n">' + (t.today || 0) + '</span><span class="l">Today</span></div>';
          statsHtml += '<div class="adm-an-stat"><span class="n">' + (t.last_7d || 0) + '</span><span class="l">Last 7 days</span></div>';
          statsHtml += '<div class="adm-an-stat"><span class="n">' + (t.last_30d || 0) + '</span><span class="l">Last 30 days</span></div>';
          statsHtml += '<div class="adm-an-stat"><span class="n">' + (t.total || 0) + '</span><span class="l">All time</span></div>';
          document.getElementById('anStats').innerHTML = statsHtml;

          // Mini sparkline in summary bar
          var miniHtml = '';
          daily.forEach(function(d) {
            var pct = Math.max(6, Math.round(Number(d.views) / maxDay * 100));
            var label = new Date(d.day).toLocaleDateString('en-US',{month:'short',day:'numeric'}) + ': ' + d.views;
            miniHtml += '<div class="b" style="height:' + pct + '%" title="' + esc(label) + '"></div>';
          });
          document.getElementById('anMiniSpark').innerHTML = miniHtml;

          // ── Detail panel ──────────────────────────────────────────
          // Categorise pages
          var CATS = {
            artist: function(p){ return /\/artist-/.test(p); },
            public: function(p){ return /\/(index|gallery|artists|printshop|contact|grants|print-)/.test(p); },
            dashboard: function(p){ return /\/(profile|sales|inquiries|documents|settings|admin|invites)/.test(p); }
          };

          function buildTable(pages) {
            if (!pages.length) return '<p class="adm-empty" style="margin:0;">No views in this category yet.</p>';
            var maxV = Number(pages[0].views) || 1;
            var h = '<div class="adm-top-pages"><table><thead><tr><th>Page</th><th class="bar-col"></th><th class="views-col">Views (30d)</th></tr></thead><tbody>';
            pages.forEach(function(p) {
              var pct = Math.round(Number(p.views) / maxV * 100);
              var label = p.path.replace('/workinprogress/','').replace('.html','') || p.path;
              h += '<tr><td>' + esc(label) + '</td>' +
                '<td class="bar-col"><div class="adm-page-bar" style="width:' + pct + '%"></div></td>' +
                '<td class="views-col">' + p.views + '</td></tr>';
            });
            h += '</tbody></table></div>';
            return h;
          }

          function filterPages(cat) {
            if (cat === 'all') return topPages;
            return topPages.filter(function(p){ return CATS[cat] && CATS[cat](p.path); });
          }

          var detail = '';

          // Sparkline section
          detail += '<div class="adm-an-section">';
          detail += '<p class="adm-an-section-title">Daily traffic — last 30 days</p>';
          detail += '<div class="adm-sparkline">';
          daily.forEach(function(d) {
            var pct = Math.max(4, Math.round(Number(d.views) / maxDay * 100));
            var label = new Date(d.day).toLocaleDateString('en-US',{month:'short',day:'numeric'}) + ': ' + d.views + ' views';
            detail += '<div class="adm-spark-bar" style="height:' + pct + '%" title="' + esc(label) + '"></div>';
          });
          detail += '</div></div>';

          // Top pages with filter tabs
          detail += '<div class="adm-an-section">';
          detail += '<p class="adm-an-section-title">Top pages</p>';
          detail += '<div class="adm-an-tabs">' +
            '<button class="adm-an-tab active" data-cat="all">All</button>' +
            '<button class="adm-an-tab" data-cat="artist">Artist pages</button>' +
            '<button class="adm-an-tab" data-cat="public">Public pages</button>' +
            '<button class="adm-an-tab" data-cat="dashboard">Dashboard</button>' +
            '</div>';
          detail += '<div id="anPageTable">' + (topPages.length ? buildTable(topPages) : '<p class="adm-empty">No data yet.</p>') + '</div>';
          detail += '</div>';

          // Artist page views grid
          if (artistViews.length) {
            detail += '<div class="adm-an-section">';
            detail += '<p class="adm-an-section-title">Artist page views (30d)</p>';
            detail += '<div class="adm-av-list">';
            artistViews.forEach(function(av) {
              var m = av.path.match(/artist-([^/]+)\.html/);
              var name = m ? m[1].split('-').map(function(w){return w.charAt(0).toUpperCase()+w.slice(1);}).join(' ') : av.path;
              detail += '<div class="adm-av-item"><span class="name">' + esc(name) + '</span><span class="cnt">' + av.views + ' views</span></div>';
            });
            detail += '</div></div>';
          }

          // Locations section
          var locs = an.locations || [];
          if (locs.length) {
            detail += '<div class="adm-an-section">';
            detail += '<p class="adm-an-section-title">Top locations (30d)</p>';
            detail += '<div class="adm-locations">';
            locs.forEach(function(l) {
              var flag = l.country ? String.fromCodePoint.apply(null,
                l.country.toUpperCase().split('').map(function(c){return 127397 + c.charCodeAt(0);})) : '🌐';
              var region = [l.region, l.country].filter(Boolean).join(', ');
              detail += '<div class="adm-loc">' +
                '<div class="adm-loc-place">' +
                  '<div class="adm-loc-city">' + flag + ' ' + esc(l.city) + '</div>' +
                  '<div class="adm-loc-region">' + esc(region) + '</div>' +
                '</div>' +
                '<span class="adm-loc-cnt">' + l.views + ' views</span>' +
              '</div>';
            });
            detail += '</div></div>';
          }

          // Traffic sources section
          var refs = an.referrers || [];
          if (refs.length) {
            var sourceIcons = {
              'Instagram': '📸', 'Facebook': '👥', 'X / Twitter': '🐦',
              'Pinterest': '📌', 'Google': '🔍', 'Bing': '🔍',
              'LinkedIn': '💼', 'TikTok': '🎵', 'Direct / unknown': '🔗'
            };
            var maxRef = Number(refs[0].views) || 1;
            detail += '<div class="adm-an-section">';
            detail += '<p class="adm-an-section-title">Traffic sources (30d)</p>';
            detail += '<div class="adm-sources">';
            refs.forEach(function(r) {
              var pct = Math.round(Number(r.views) / maxRef * 100);
              var icon = sourceIcons[r.source] || '🌐';
              detail += '<div class="adm-source">' +
                '<span class="adm-source-icon">' + icon + '</span>' +
                '<div class="adm-source-info">' +
                  '<div class="adm-source-name">' + esc(r.source) + '</div>' +
                  '<div class="adm-source-bar-wrap"><div class="adm-source-bar" style="width:' + pct + '%"></div></div>' +
                '</div>' +
                '<span class="adm-source-cnt">' + r.views + '</span>' +
              '</div>';
            });
            detail += '</div></div>';
          }

          document.getElementById('analyticsContent').innerHTML = detail;

          // Tab switching
          document.getElementById('analyticsContent').addEventListener('click', function(e) {
            var tab = e.target.closest('.adm-an-tab');
            if (!tab) return;
            document.querySelectorAll('.adm-an-tab').forEach(function(t){ t.classList.remove('active'); });
            tab.classList.add('active');
            document.getElementById('anPageTable').innerHTML = buildTable(filterPages(tab.dataset.cat));
          });

          // Expose for use in loadDetail + roster cards
          window._kudzuArtistViews = {};
          artistViews.forEach(function(av) {
            var m2 = av.path.match(/artist-([^/]+)\.html/);
            if (m2) window._kudzuArtistViews[m2[1]] = Number(av.views);
          });
          artistViews.forEach(function(av) {
            var m = av.path.match(/artist-([^/]+)\.html/);
            if (!m) return;
            var el = document.getElementById('av-' + m[1]);
            if (!el) return;
            el.querySelector('strong').textContent = av.views;
          });
        } catch(_e) {
          document.getElementById('anStats').innerHTML = '<span style="color:var(--a-soft);font-size:13px;">Analytics unavailable.</span>';
          document.getElementById('analyticsContent').innerHTML = '';
        }
      })();

      document.getElementById('main').addEventListener('click', function (e) {
        var row = e.target.closest('.adm-artist-row');
        if (!row) return;
        var id = row.dataset.id;
        var card = document.getElementById('artist-' + id);
        var detail = document.getElementById('detail-' + id);
        var isOpen = card.classList.toggle('open');
        if (isOpen && !detail.dataset.loaded) {
          detail.dataset.loaded = '1';
          loadDetail(id, detail);
        }
      });
    } catch (err) {
      document.getElementById('main').innerHTML = '<p style="color:var(--a-soft)">Could not load admin data.</p>';
    }
  });
})();
</script>
<script src="js/track.js" defer></script>
</body>
</html>
