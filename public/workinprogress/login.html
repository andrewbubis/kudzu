<main class="acct">
  <div class="signin">
    <h1>artist login</h1>

    <label class="remember-row" id="rememberRow">
      <input type="checkbox" id="rememberMe" name="remember" checked> Stay signed in
    </label>

    <div class="oauth">
      <a href="/api/auth/google" id="googleBtn">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <path fill="#4285F4" d="M45.1 24.5c0-1.6-.1-3.1-.4-4.5H24v8.5h11.8c-.5 2.7-2 5-4.4 6.6v5.5h7.1c4.1-3.8 6.6-9.4 6.6-16.1z"/>
          <path fill="#34A853" d="M24 46c5.9 0 10.9-2 14.5-5.4l-7.1-5.5c-2 1.3-4.5 2.1-7.4 2.1-5.7 0-10.5-3.8-12.2-9H4.5v5.7C8.1 41.1 15.5 46 24 46z"/>
          <path fill="#FBBC05" d="M11.8 28.2c-.4-1.3-.7-2.7-.7-4.2s.3-2.9.7-4.2v-5.7H4.5C2.9 17.3 2 20.5 2 24s.9 6.7 2.5 9.9l7.3-5.7z"/>
          <path fill="#EA4335" d="M24 10.8c3.2 0 6.1 1.1 8.4 3.3l6.3-6.3C34.9 4.2 29.9 2 24 2 15.5 2 8.1 6.9 4.5 14.1l7.3 5.7c1.7-5.2 6.5-9 12.2-9z"/>
        </svg>
        Continue with Google
      </a>
      <a href="/api/auth/apple">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor">
          <path d="M16.4 12.8c0-2.6 2.1-3.9 2.2-4-1.2-1.8-3.1-2-3.8-2-1.6-.2-3.1.9-3.9.9-.8 0-2.1-.9-3.4-.9-1.7 0-3.3 1-4.2 2.6-1.8 3.1-.5 7.7 1.3 10.2.9 1.2 1.9 2.6 3.2 2.6 1.3-.1 1.8-.8 3.3-.8s2 .8 3.4.8c1.4 0 2.3-1.2 3.1-2.5.98-1.4 1.4-2.8 1.4-2.9-.03-.02-2.6-1-2.6-4zM14 4.6c.7-.9 1.2-2.1 1.1-3.3-1 0-2.3.7-3.1 1.6-.7.8-1.2 2-1.1 3.2 1.2.1 2.4-.6 3.1-1.5z"/>
        </svg>
        Continue with Apple
      </a>
    </div>

    <p class="rule">or</p>

    <p class="err" id="oauthErr" role="alert" hidden></p>

    <form id="loginForm" novalidate>
      <p class="err" id="err" role="alert" hidden></p>

      <label for="email">email</label>
      <input id="email" name="email" type="email" autocomplete="email" required>

      <label for="password">password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>

      <button class="acct-btn" type="submit" id="submitBtn">Log in</button>
    </form>

    <p class="note">Kudzu is invite only. If you have an invite link from us, open it to set up your account.</p>
  </div>
</main>

<script>
/* The OAuth routes report failure by bouncing back here with ?error=<why>.
   Nothing used to read it, so every failure looked like the page simply
   reloading itself — including the common case of the provider not being
   configured at all. Say what actually happened. */
(function () {
  var why = new URLSearchParams(location.search).get('error');
  if (!why) return;

  // bad_state is usually a cookie-timing glitch on first attempt.
  // Silently retry once using sessionStorage to prevent a loop.
  if (why === 'bad_state' && !sessionStorage.getItem('oauth_retried')) {
    sessionStorage.setItem('oauth_retried', '1');
    location.replace('/api/auth/google');
    return;
  }
  sessionStorage.removeItem('oauth_retried');

  var says = {
    oauth_unconfigured: 'Google sign-in is not switched on yet. Log in with your email and password.',
    apple_unavailable:  'Sign in with Apple is not available yet. Use Google or your email and password.',
    backend_unavailable:'We can’t reach the database right now, so sign-in is down. Try again shortly.',
    no_invite:          'That Google account has no Kudzu invite. Open your invite link to set up an account.',
    email_unverified:   'Google has not verified that address. Verify it with Google, then try again.',
    bad_state:          'That sign-in attempt expired or was interrupted. Please try again.',
    no_code:            'Google did not complete the sign-in. Please try again.',
    oauth_failed:       'Something went wrong signing in with Google. Please try again.'
  };
  var box = document.getElementById('oauthErr');
  box.textContent = says[why] || 'Sign-in failed (' + why + '). Please try again.';
  box.hidden = false;
  // Clear it from the URL so a refresh doesn't resurrect a stale error.
  history.replaceState(null, '', location.pathname);
})();

document.getElementById('loginForm').addEventListener('submit', async function (e) {
  e.preventDefault();
  var err = document.getElementById('err');
  var btn = document.getElementById('submitBtn');
  err.hidden = true;
  btn.disabled = true; btn.textContent = 'Logging in…';
  try {
    var res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'same-origin',
      body: JSON.stringify({
        email: document.getElementById('email').value.trim(),
        password: document.getElementById('password').value,
        remember: document.getElementById('rememberMe').checked
      })
    });
    if (!res.ok) throw new Error(res.status === 401 ? 'bad' : 'down');
    sessionStorage.removeItem('oauth_retried');
    location.href = 'profile.html';
  } catch (e2) {
    /* This used to say "the backend is still being built" for every
       non-401, which is a lie once the thing is built — a database
       outage looked identical to an unfinished feature. */
    err.textContent = e2.message === 'bad'
      ? 'That email and password do not match.'
      : 'Sign-in is temporarily unavailable — we can’t reach the database. Please try again shortly.';
    err.hidden = false;
    btn.disabled = false; btn.textContent = 'Log in';
  }
});

// Wire "Stay signed in" to both login paths.
// For Google, we set a short-lived cookie before the redirect;
// the OAuth callback reads it and applies it to the session.
document.getElementById('googleBtn').addEventListener('click', function () {
  var remember = document.getElementById('rememberMe').checked;
  document.cookie = 'kudzu_remember=' + (remember ? '1' : '0') +
    '; path=/; max-age=600; samesite=lax' +
    (location.protocol === 'https:' ? '; secure' : '');
});
</script>
<script src="js/nav-auth.js" defer></script>
<script src="js/track.js" defer></script>
</body>
</html>
