<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Artist login · Kudzu Arts</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#fbfaf7">
<link rel="icon" href="img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=Albert+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/v3.css">
<link rel="stylesheet" href="css/account.css">
</head>
<body>

<header class="site-header">
  <a href="index.html" class="brand"><img class="mark" src="img/logo-k.png" alt="" aria-hidden="true"><span class="word"><b>KUDZU</b><span class="arts">arts</span></span></a>
  <nav class="nav" aria-label="Primary">
    <a href="artists.html">Artists</a>
    <a href="exhibitions.html">Exhibitions</a>
    <a href="gallery.html">Virtual Gallery</a>
    <a href="printshop.html">Print Shop</a>
    <a href="contact.html">Contact</a>
  </nav>
  <button class="nav-toggle" type="button" aria-expanded="false">Menu</button>
</header>

<main class="acct">
  <div class="signin">
    <h1>artist login</h1>

    <div class="oauth">
      <a href="/api/auth/google">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <path fill="#4285F4" d="M45.1 24.5c0-1.6-.1-3.1-.4-4.5H24v8.5h11.8c-.5 2.7-2 5-4.4 6.6v5.5h7.1c4.1-3.8 6.6-9.4 6.6-16.1z"/>
          <path fill="#34A853" d="M24 46c5.9 0 10.9-2 14.5-5.4l-7.1-5.5c-2 1.3-4.5 2.1-7.4 2.1-5.7 0-10.5-3.8-12.2-9H4.5v5.7C8.1 41.1 15.5 46 24 46z"/>
          <path fill="#FBBC05" d="M11.8 28.2c-.4-1.3-.7-2.7-.7-4.2s.3-2.9.7-4.2v-5.7H4.5C2.9 17.3 2 20.5 2 24s.9 6.7 2.5 9.9l7.3-5.7z"/>
          <path fill="#EA4335" d="M24 10.8c3.2 0 6.1 1.1 8.4 3.3l6.3-6.3C34.9 4.2 29.9 2 24 2 15.5 2 8.1 6.9 4.5 14.1l7.3 5.7c1.7-5.2 6.5-9 12.2-9z"/>
        </svg>
        Continue with Google
      </a>
      <a href="/api/auth/apple">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor">
          <path d="M16.4 12.8c0-2.6 2.1-3.9 2.2-4-1.2-1.8-3.1-2-3.8-2-1.6-.2-3.1.9-3.9.9-.8 0-2.1-.9-3.4-.9-1.7 0-3.3 1-4.2 2.6-1.8 3.1-.5 7.7 1.3 10.2.9 1.2 1.9 2.6 3.2 2.6 1.3-.1 1.8-.8 3.3-.8s2 .8 3.4.8c1.4 0 2.3-1.2 3.1-2.5.98-1.4 1.4-2.8 1.4-2.9-.03-.02-2.6-1-2.6-4zM14 4.6c.7-.9 1.2-2.1 1.1-3.3-1 0-2.3.7-3.1 1.6-.7.8-1.2 2-1.1 3.2 1.2.1 2.4-.6 3.1-1.5z"/>
        </svg>
        Continue with Apple
      </a>
    </div>

    <p class="rule">or</p>

    <form id="loginForm" novalidate>
      <p class="err" id="err" role="alert" hidden></p>

      <label for="email">email</label>
      <input id="email" name="email" type="email" autocomplete="email" required>

      <label for="password">password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>

      <button class="acct-btn" type="submit" id="submitBtn">Log in</button>
    </form>

    <p class="note">Kudzu is invite only. If you have an invite link from us, open it to set up your account.</p>
  </div>
</main>

<script>
document.getElementById('loginForm').addEventListener('submit', async function (e) {
  e.preventDefault();
  var err = document.getElementById('err');
  var btn = document.getElementById('submitBtn');
  err.hidden = true;
  btn.disabled = true; btn.textContent = 'Logging in…';
  try {
    var res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'same-origin',
      body: JSON.stringify({
        email: document.getElementById('email').value.trim(),
        password: document.getElementById('password').value
      })
    });
    if (!res.ok) throw new Error(res.status === 401 ? 'bad' : 'down');
    location.href = 'profile.html';
  } catch (e2) {
    err.textContent = e2.message === 'bad'
      ? 'That email and password do not match.'
      : 'Login is not available yet — the backend is still being built.';
    err.hidden = false;
    btn.disabled = false; btn.textContent = 'Log in';
  }
});
</script>
</body>
</html>
