  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

 U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  @keyframes kudzuFade { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:none; } }\n  @keyframes kudzuReveal { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }\n  body { margin:0; background:#1f1a26; }\n  input::placeholder, textarea::placeholder { color:#a89e88; opacity:.65; font-style:italic; }\n  ::selection { background:#556117; color:#171320; }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n\n<div style=\"min-height:100vh; background:#1f1a26; color:#ece4d2; font-family:'Albert Sans',system-ui,sans-serif; line-height:1.5;\">\n\n  <!-- ═══════════ SHARED HEADER (logged in) ═══════════ -->\n  <sc-if value=\"{{ showApp }}\" hint-placeholder-val=\"\">\n    <div style=\"position:sticky; top:0; z-index:40; display:flex; align-items:center; justify-content:space-between; padding:15px 34px; background:rgba(31,26,38,.92); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); border-bottom:1px solid rgba(236,228,210,.16);\">\n      <div style=\"display:flex; align-items:center; gap:34px;\">\n        <button onclick=\"{{ goMe }}\" style=\"display:flex; align-items:center; gap:12px; background:transparent; border:none; cursor:pointer;\">\n          <span style=\"width:32px; height:32px; border:1px solid #556117; display:grid; place-items:center; font-family:'Spectral',serif; font-size:18px; color:#ece4d2;\">K<\u002Fspan>\n          <span style=\"font-family:'Spectral',serif; font-size:20px; color:#ece4d2; letter-spacing:.02em;\">Kudzu Arts<\u002Fspan>\n        <\u002Fbutton>\n        <nav style=\"display:flex; gap:24px; font-family:'Albert Sans',sans-serif; font-size:13px; letter-spacing:.03em;\">\n          <a href=\"#\" style=\"color:#ece4d2; text-decoration:none;\" style-hover=\"color:#a98f52;\">Artists<\u002Fa>\n          <a href=\"#\" style=\"color:#ece4d2; text-decoration:none;\" style-hover=\"color:#a98f52;\">Gallery<\u002Fa>\n          <a href=\"#\" style=\"color:#ece4d2; text-decoration:none;\" style-hover=\"color:#a98f52;\">Printshop<\u002Fa>\n          <button onclick=\"{{ goFaq }}\" style=\"background:transparent; border:none; cursor:pointer; color:#ece4d2; font-family:'Albert Sans',sans-serif; font-size:13px; letter-spacing:.03em; padding:0;\" style-hover=\"color:#a98f52;\">FAQ<\u002Fbutton>\n        <\u002Fnav>\n      <\u002Fdiv>\n      <div style=\"position:relative;\">\n        <button onclick=\"{{ toggleMenu }}\" style=\"display:flex; align-items:center; gap:8px; background:transparent; border:none; cursor:pointer; font-family:'Spectral',serif; font-style:italic; font-size:16px; color:#ece4d2;\">{{ accountHandle }} <span style=\"font-family:'Albert Sans'; font-size:10px; color:#a89e88;\">▾<\u002Fspan><\u002Fbutton>\n        <sc-if value=\"{{ menuOpen }}\" hint-placeholder-val=\"\">\n          <div onclick=\"{{ toggleMenu }}\" style=\"position:fixed; inset:0; z-index:41;\"><\u002Fdiv>\n          <div style=\"position:absolute; right:0; top:calc(100% + 12px); z-index:42; width:196px; background:#2a2333; border:1px solid rgba(236,228,210,.18); box-shadow:0 22px 54px rgba(0,0,0,.45); padding:8px 0; animation:kudzuReveal .16s ease both;\">\n            <sc-for list=\"{{ menuItems }}\" as=\"it\" hint-placeholder-count=\"6\">\n              <button onclick=\"{{ it.onClick }}\" style=\"display:block; width:100%; text-align:left; background:transparent; border:none; cursor:pointer; font-family:'Albert Sans',sans-serif; font-size:14px; color:#ece4d2; padding:9px 20px;\" style-hover=\"background:#1f1a26; color:#a98f52;\">{{ it.label }}<\u002Fbutton>\n            <\u002Fsc-for>\n            <div style=\"height:1px; background:rgba(236,228,210,.16); margin:8px 0;\"><\u002Fdiv>\n            <button onclick=\"{{ signOut }}\" style=\"display:block; width:100%; text-align:left; background:transparent; border:none; cursor:pointer; font-family:'Albert Sans',sans-serif; font-size:13px; letter-spacing:.02em; color: :380px;\">{{ loginLede }}<\u002Fp>\n\n        <div style=\"margin-bottom:24px;\">\n          <label style=\"display:block; font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.22em; text-transform:uppercase; color:#556117; margin-bottom:11px;\">Email<\u002Flabel>\n          <input type=\"email\" value=\"{{ email }}\" onchange=\"{{ onEmail }}\" placeholder=\"you@studio.com\" style=\"width:100%; background:transparent; border:none; border-bottom:1px solid rgba(236,228,210,.16); color:#ece4d2; font-family:'Spectral',serif; font-size:18px; padding:6px 0 12px; outline:none;\" style-focus=\"border-bottom-color:#a98f52;\">\n        <\u002Fdiv>\n        <div style=\"margin-bottom:32px;\">\n          <label style=\"display:block; font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.22em; text-transform:uppercase; color:#556117; margin-bottom:11px;\">Password<\u002Flabel>\n          <input type=\"password\" value=\"{{ password }}\" onchange=\"{{ onPassword }}\" placeholder=\"••••••••\" style=\"width:100%; background:transparent; border:none; border-bottom:1px solid rgba(236,228,210,.16); color:#ece4d2; font-family:'Spectral',serif; font-size:18px; padding:6px 0 12px; outline:none;\" style-focus=\"border-bottom-color:#a98f52;\">\n        <\u002Fdiv>\n\n        <button onclick=\"{{ signIn }}\" style=\"width:100%; background:#556117; color:#171320; border:none; padding:16px 28px; font-family:'Albert Sans',sans-serif; font-size:14px; font-weight:600; letter-spacing:.04em; cursor:pointer; transition:background .2s;\" style-hover=\"background:#738e68;\">{{ loginCta }}<\u002Fbutton>\n\n        <div style=\"display:flex; justify-content:space-between; margin-top:20px; font-family:'Albert Sans',sans-serif; font-size:13px;\">\n          <a href=\"#\" style=\"color:#a89e88; text-decoration:none;\" style-hover=\"color:#a98f52;\">Forgot password?<\u002Fa>\n          <span style=\"color:#ece4d2;\">{{ loginAlt }}<\u002Fspan>\n        <\u002Fdiv>\n\n        <p style=\"font-family:'Albert Sans',sans-serif; font-size:12.5px; line-height:1.6; color:#738e68; margin:26px 0 0; padding-top:22px; border-top:1px solid rgba(236,228,210,.12);\">Anyone can browse and <span style=\"color:#cfc6b2;\">buy work without an account<\u002Fspan> — you only need to sign in to sell, save favorites, or message an artist. Artist accounts are <span style=\"color:#a98f52;\">by invitation only<\u002Fspan>.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ═══════════ PROFILE · ARTIST (me) ═══════════ -->\n  <sc-if value=\"{{ isProfileArtist }}\" hint-placeholder-val=\"\">\n    <div style=\"max-width:1120px; margin:0 auto; padding:46px 34px 96px;\">\n\n      <div style=\"display:grid; grid-template-columns:232px 1fr; gap:38px; align-items:start;\">\n        <div onclick=\"{{ onPickPhoto }}\" style=\"position:relative; width:232px; height:232px; background:#2a2333; overflow:hidden; cursor:pointer; border:1px solid rgba(236,228,210,.12);\" style-hover=\"border-color:#a98f52;\">\n          <sc-if value=\"{{ profilePhoto }}\" hint-placeholder-val=\"\"><img src=\"{{ profilePhoto }}\" alt=\"Profile\" style=\"position:absolute; inset:0; width:100%; height:100%; object-fit:cover;\"><\u002Fsc-if>\n          <sc-if value=\"{{ noPhoto }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"position:absolute; inset:0; display:grid; place-items:center; text-align:center; padding:16px; background:radial-gradient(120% 90% at 30% 20%, rgba(255,255,255,0.05), transparent 60%);\"><span style=\"font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:#a89e88;\">Add a profile photo<\u002Fspan><\u002Fdiv><\u002Fsc-if>\n          <input type=\"file\" accept=\"image/*\" ref=\"{{ photoRef }}\" onchange=\"{{ onPhotoInput }}\" style=\"display:none;\">\n        <\u002Fdiv>\n\n        <div style=\"position:relative;\">\n          <button style=\"position:absolute; top:0; right:0; background:transparent; border:1px solid rgba(236,228,210,.16); color:#a89e88; font-family:'Albert Sans'; font-size:11px; letter-spacing:.08em; text-transform:uppercase; padding:7px 13px; cursor:pointer;\" style-hover=\"border-color:#a98f52; color:#a98f52;\">share ↗<\u002Fbutton>\n          <h1 style=\"font-family:'Spectral',serif; font-weight:300; font-size:clamp(34px,4.4vw,52px); line-height:1.04; letter-spacing:-0.01em; color:#ece4d2; margin:2px 0 0;\">{{ artistName }}<\u002Fh1>\n          <p style=\"font-family:'Spectral',serif; font-size:17px; color:#cfc6b2; margin:16px 0 0;\">b. 1991, <a href=\"#\" style=\"color:#ece4d2; text-decoration:none; border-bottom:1px solid #556117;\" style-hover=\"color:#a98f52;\">United States<\u002Fa><\u002Fp>\n          <p style=\"font-family:'Spectral',serif; font-size:17px; color:#cfc6b2; margin:4px 0 0;\">works in <a href=\"#\" style=\"color:#ece4d2; text-decoration:none; border-bottom:1px solid #556117;\" style-hover=\"color:#a98f52;\">Los Angeles, CA<\u002Fa> · <a href=\"#\" style=\"color:#ece4d2; text-decoration:none; border-bottom:1px solid #556117;\" style-hover=\"color:#a98f52;\">United States<\u002Fa><\u002Fp>\n          <p style=\"font-family:'Albert Sans',sans-serif; font-size:13px; font-style:italic; color:#738e68; margin:18px 0 0;\">no link added <span style=\"font-style:normal; color:#a98f52;\">+<\u002Fspan><\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ showCallout }}\" hint-placeholder-val=\"\">\n        <div style=\"position:relative; margin-top:30px; background:#1d2718; border:1px solid rgba(115,142,104,.35); padding:22px 26px;\">\n          <button onclick=\"{{ dismissCallout }}\" style=\"position:absolute; top:14px; right:16px; background:transparent; border:none; color:#a89e88; font-size:16px; cursor:pointer;\" style-hover=\"color:#ece4d2;\">×<\u002Fbutton>\n          <p style=\"font-family:'Spectral',serif; font-style:italic; font-size:19px; color:#ece4d2; margin:0 0 14px;\">Start selling your work<\u002Fp>\n          <p style=\"font-family:'Albert Sans',sans-serif; font-size:14px; line-height:1.6; color:#cfc6b2; margin:0 0 8px;\">Connect a payout account through Stripe to list and sell works. <span style=\"color:#a98f52;\">✓<\u002Fspan><\u002Fp>\n          <p style=\"font-family:'Albert Sans',sans-serif; font-size:14px; line-height:1.6; color:#cfc6b2; margin:0;\">Complete your bio and c.v so collectors can learn about your practice. <span style=\"color:#a98f52;\">✓<\u002Fspan><\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- tabs -->\n      <div style=\"display:flex; gap:28px; margin-top:36px; border-bottom:1px solid rgba(236,228,210,.16);\">\n        <sc-for list=\"{{ profileTabs }}\" as=\"t\" hint-placeholder-count=\"5\">\n          <button onclick=\"{{ t.onClick }}\" style=\"{{ t.style }}\">{{ t.label }}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <!-- WORK tab -->\n      <sc-if value=\"{{ tabWork }}\" hint-placeholder-val=\"\">\n        <div>\n          <div style=\"display:flex; justify-content:space-between; align-items:baseline; margin:24px 0 18px;\">\n            <div style=\"display:flex; gap:14px; align-items:center; font-family:'Albert Sans',sans-serif; font-size:14px;\">\n              <button onclick=\"{{ goStudio }}\" style=\"background:transparent; border:none; cursor:pointer; color:#ece4d2; font-family:'Albert Sans'; font-size:14px; font-style:italic; border-bottom:1px solid #556117; padding:0 0 2px;\" style-hover=\"color:#a98f52;\">upload<\u002Fbutton>\n              <span style=\"color:#a89e88;\">|<\u002Fspan>\n              <a href=\"#\" style=\"color:#ece4d2; font-style:italic; text-decoration:none; border-bottom:1px solid #556117; padding-bottom:2px;\" style-hover=\"color:#a98f52;\">reorder<\u002Fa>\n            <\u002Fdiv>\n            <div style=\"font-family:'Albert Sans',sans-serif; font-size:13px; color:#a89e88;\">\n              <span style=\"color:#ece4d2; border-bottom:1px solid #556117; padding-bottom:2px;\">published ({{ publishedCount }}/10)<\u002Fspan> &nbsp;&nbsp; drafts (0)\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:grid; grid-template-columns:repeat(3,1fr); gap:1px; background:rgba(236,228,210,.14);\">\n            <sc-for list=\"{{ workTiles }}\" as=\"w\" hint-placeholder-count=\"4\">\n              <div style=\"background:#1f1a26; padding:14px;\">\n                <div style=\"aspect-ratio:4/5; margin-bottom:12px; position:relative; overflow:hidden; background:{{ w.tone }};\">\n                  <sc-if value=\"{{ w.image }}\" hint-placeholder-val=\"\"><img src=\"{{ w.image }}\" alt=\"\" style=\"position:absolute; inset:0; width:100%; height:100%; object-fit:cover;\"><\u002Fsc-if>\n                <\u002Fdiv>\n                <div style=\"display:flex; justify-content:space-between; align-items:baseline; gap:10px;\">\n                  <h3 style=\"font-family:'Spectral',serif; font-weight:400; font-size:17px; color:#ece4d2; margin:0;\">{{ w.title }}<\u002Fh3>\n                  <span style=\"font-family:'JetBrains Mono',monospace; font-size:12px; color:#a98f52; white-space:nowrap;\">{{ w.price }}<\u002Fspan>\n                <\u002Fdiv>\n                <p style=\"font-family:'Spectral',serif; font-style:italic; font-size:13px; color:#738e68; margin:5px 0 0;\">{{ w.spec }}<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <div onclick=\"{{ goStudio }}\" style=\"background:#1f1a26; padding:14px; cursor:pointer;\">\n              <div style=\"aspect-ratio:4/5; border:1px dashed rgba(236,228,210,.28); display:grid; place-items:center;\" style-hover=\"border-color:#a98f52;\">\n                <span style=\"font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:#a89e88;\">+ upload a work<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- SOLD tab -->\n      <sc-if value=\"{{ tabSold }}\" hint-placeholder-val=\"\">\n        <div style=\"padding-top:24px;\">\n          <div style=\"display:grid; grid-template-columns:repeat(3,1fr); gap:1px; background:rgba(236,228,210,.14);\">\n            <sc-for list=\"{{ soldTiles }}\" as=\"w\" hint-placeholder-count=\"2\">\n              <div style=\"background:#1f1a26; padding:14px; opacity:.72;\">\n                <div style=\"aspect-ratio:4/5; margin-bottom:12px; position:relative; overflow:hidden; background:{{ w.tone }};\">\n                  <span style=\"position:absolute; top:10px; left:10px; font-family:'JetBrains Mono',monospace; font-size:9px; letter-spacing:.14em; text-transform:uppercase; padding:4px 9px; background:rgba(236,228,210,.16); color:#ece4d2;\">Sold<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"display:flex; justify-content:space-between; align-items:baseline; gap:10px;\">\n                  <h3 style=\"font-family:'Spectral',serif; font-weight:400; font-size:17px; color:#ece4d2; margin:0;\">{{ w.title }}<\u002Fh3>\n                  <span style=\"font-family:'JetBrains Mono',monospace; font-size:12px; color:#a89e88; text-decoration:line-through; white-space:nowrap;\">{{ w.price }}<\u002Fspan>\n                <\u002Fdiv>\n                <p style=\"font-family:'Spectral',serif; font-style:italic; font-size:13px; color:#738e68; margin:5px 0 0;\">{{ w.spec }}<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- BIO tab -->\n      <sc-if value=\"{{ tabBio }}\" hint-placeholder-val=\"\">\n        <div style=\"padding-top:26px; max-width:680px;\">\n          <p style=\"font-family:'Spectral',serif; font-size:18px; line-height:1.7; color:#cfc6b2; margin:0 0 18px;\">Ian Patrick Cato is a painter and ceramicist working between Nashville and Los Angeles. His work draws on southern landscape, memory, and the slow, insistent growth of things left untended.<\u002Fp>\n          <p style=\"font-family:'Spectral',serif; font-size:18px; line-height:1.7; color:#cfc6b2; margin:0 0 24px;\">Working in oil, gouache, and glazed earthenware, he builds images that sit between the observed and the imagined — figures half-swallowed by foliage, interiors lit like dusk.<\u002Fp>\n          <a href=\"#\" style=\"font-family:'Albert Sans',sans-serif; font-size:14px; font-style:italic; color:#ece4d2; text-decoration:none; border-bottom:1px solid #556117; padding-bottom:2px;\" style-hover=\"color:#a98f52;\">edit bio<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- CV tab -->\n      <sc-if value=\"{{ tabCv }}\" hint-placeholder-val=\"\">\n        <div style=\"padding-top:24px; max-width:820px;\">\n          <p style=\"font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.22em; text-transform:uppercase; color:#556117; margin:0 0 6px;\">Selected exhibitions<\u002Fp>\n          <div style=\"border-top:1px solid rgba(236,228,210,.16); margin-top:12px;\">\n            <sc-for list=\"{{ cvRows }}\" as=\"c\" hint-placeholder-count=\"3\">\n              <div style=\"display:grid; grid-template-columns:70px 1fr auto; gap:22px; align-items:baseline; padding:16px 0; border-bottom:1px solid rgba(236,228,210,.16);\">\n                <span style=\"font-family:'JetBrains Mono',monospace; font-size:13px; color:#a98f52;\">{{ c.year }}<\u002Fspan>\n                <span style=\"font-family:'Spectral',serif; font-style:italic; font-size:18px; color:#ece4d2;\">{{ c.title }}<\u002Fspan>\n                <span style=\"font-family:'Albert Sans',sans-serif; font-size:13px; color:#a89e88;\">{{ c.venue }}, {{ c.city }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <a href=\"#\" style=\"display:inline-block; margin-top:18px; font-family:'Albert Sans',sans-serif; font-size:14px; font-style:italic; color:#ece4d2; text-decoration:none; border-bottom:1px solid #556117; padding-bottom:2px;\" style-hover=\"color:#a98f52;\">edit c.v<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- GUESTBOOK tab -->\n      <sc-if value=\"{{ tabGuest }}\" hint-placeholder-val=\"\">\n        <div style=\"padding-top:24px;\">\n          <div style=\"border:1px solid rgba(236,228,210,.16); padding:34px; text-align:center; background:#2a2333;\">\n            <p style=\"font-family:'Spectral',serif; font-size:20px; color:#ece4d2; margin:0 0 8px;\">The guestbook is empty<\u002Fp>\n            <p style=\"font-family:'Albert Sans',sans-serif; font-size:14px; color:#cfc6b2; margin:0;\">Collectors and visitors can leave a note on your profile.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ═══════════ PROFILE · COLLECTOR (me) ═══════════ -->\n  <sc-if value=\"{{ isProfileCollector }}\" hint-placeholder-val=\"\">\n    <div style=\"max-width:1120px; margin:0 auto; padding:46px 34px 96px;\">\n      <div style=\"display:grid; grid-template-columns:180px 1fr; gap:38px; align-items:start;\">\n        <div onclick=\"{{ onPickPhoto }}\" style=\"position:relative; width:180px; height:180px; border-radius:50%; background:#2a2333; overflow:hidden; cursor:pointer; border:1px solid rgba(236,228,210,.12);\" style-hover=\"border-color:#a98f52;\">\n          <sc-if value=\"{{ profilePhoto }}\" hint-placeholder-val=\"\"><img src=\"{{ profilePhoto }}\" alt=\"Profile\" style=\"position:absolute; inset:0; width:100%; height:100%; object-fit:cover;\"><\u002Fsc-if>\n          <sc-if value=\"{{ noPhoto }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"position:absolute; inset:0; display:grid; place-items:center; text-align:center; padding:16px;\"><span style=\"font-family:'JetBrains Mono',monospace; font-size:9px; letter-spacing:.14em; text-transform:uppercase; color:#a89e88;\">Add a photo<\u002Fspan><\u002Fdiv><\u002Fsc-if>\n          <input type=\"file\" accept=\"image/*\" ref=\"{{ photoRef }}\" onchange=\"{{ onPhotoInput }}\" style=\"display:none;\">\n        <\u002Fdiv>\n        <div>\n          <p style=\"font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:#556117; margin:4px 0 10px;\">Private collector profile<\u002Fp>\n          <h1 style=\"font-family:'Spectral',serif; font-weight:300; font-size:clamp(32px,4vw,48px); line-height:1.05; color:#ece4d2; margin:0;\">{{ artistName }}<\u002Fh1>\n          <p style=\"font-family:'Spectral',serif; font-size:17px; color:#cfc6b2; margin:14px 0 0;\">Los Angeles, CA · United States<\u002Fp>\n          <div style=\"margin-top:26px; background:#2a2333; border:1px solid rgba(236,228,210,.16); padding:22px 26px; max-width:560px;\">\n            <p style=\"font-family:'Spectral',serif; font-style:italic; font-size:17px; color:#ece4d2; margin:0 0 10px;\">Your profile is private.<\u002Fp>\n            <p style=\"font-family:'Albert Sans',sans-serif; font-size:14px; line-height:1.6; color:#cfc6b2; margin:0 0 18px;\">It lives only inside Kudzu — used to message artists, make offers, and track orders. It is never shown publicly. You can buy any available work without it.<\u002Fp>\n            <div style=\"display:flex; gap:12px; flex-wrap:wrap;\">\n              <button onclick=\"{{ goInquiries }}\" style=\"background:#556117; color:#171320; border:none; padding:11px 20px; font-family:'Albert Sans'; font-size:13px; font-weight:600; letter-spacing:.03em; cursor:pointer;\" style-hover=\"background:#738e68;\">Your inquiries<\u002Fbutton>\n              <button onclick=\"{{ goOrders }}\" style=\"background:transparent; color:#ece4d2; border:1px solid rgba(236,228,210,.2); padding:11px 20px; font-family:'Albert Sans'; font-size:13px; cursor:pointer;\" style-hover=\"border-color:#a98f52; color:#a98f52;\">Your orders<\u002Fbutton>\n              <button onclick=\"{{ goFavorites }}\" style=\"background:transparent; color:#ece4d2; border:1px solid rgba(236,228,210,.2); padding:11px 20px; font-family:'Albert Sans'; font-size:13px; cursor:pointer;\" style-hover=\"border-color:#a98f52; color:#a98f52;\">Favorites<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ═══════════ LIST / EMPTY-STATE screens ═══════════ -->\n  <sc-if value=\"{{ isList }}\" hint-placeholder-val=\"\">\n    <div style=\"max-width:1120px; margin:0 auto; padding:46px 34px 96px;\">\n      <h1 style=\"font-family:'Spectral',serif; font-weight:300; font-size:clamp(34px,4.4vw,52px); color:#ece4d2; margin:0 0 26px;\">{{ viewTitle }} <span style=\"color:#a89e88;\">({{ viewCount }})<\u002Fspan><\u002Fh1>\n      <div style=\"border:1px solid rgba(236,228,210,.16); background:#2a2333; padding:34px;\">\n        <p style=\"font-family:'Spectral',serif; font-size:21px; color:#ece4d2; margin:0 0 12px;\">{{ viewEmptyTitle }}<\u002Fp>\n        <p style=\"font-family:'Albert Sans',sans-serif; font-size:15px; line-height:1.6; color:#cfc6b2; margin:0 0 8px; max-width:560px;\">{{ viewEmptyBody }}<\u002Fp>\n        <p style=\"font-family:'Albert Sans',sans-serif; font-size:12.5px; line-height:1.6; color:#738e68; margin:0; max-width:560px;\">{{ viewEmptyNote }}<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ═══════════ SETTINGS ═══════════ -->\n  <sc-if value=\"{{ isSettings }}\" hint-placeholder-val=\"\">\n    <div style=\"max-width:640px; margin:0 auto; padding:46px 34px 96px;\">\n      <h1 style=\"font-family:'Spectral',serif; font-weight:300; font-size:clamp(34px,4.4vw,52px); color:#ece4d2; margin:0 0 30px;\">Settings<\u002Fh1>\n      <div style=\"display:flex; flex-direction:column; gap:26px;\">\n        <div>\n          <label style=\"display:block; font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.22em; text-transform:uppercase; color:#556117; margin-bottom:10px;\">Display name<\u002Flabel>\n          <input defaultvalue=\"{{ artistName }}\" style=\"width:100%; background:transparent; border:none; border-bottom:1px solid rgba(236,228,210,.16); color:#ece4d2; font-family:'Spectral',serif; font-size:18px; padding:6px 0 12px; outline:none;\" style-focus=\"border-bottom-color:#a98f52;\">\n        <\u002Fdiv>\n        <div>\n          <label style=\"display:block; font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.22em; text-transform:uppercase; color:#556117; margin-bottom:10px;\">Email<\u002Flabel>\n          <input defaultvalue=\"you@studio.com\" style=\"width:100%; background:transparent; border:none; border-bottom:1px solid rgba(236,228,210,.16); color:#ece4d2; font-family:'Spectral',serif; font-size:18px; padding:6px 0 12px; outline:none;\" style-focus=\"border-bottom-color:#a98f52;\">\n        <\u002Fdiv>\n        <div>\n          <label style=\"display:block; font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.22em; text-transform:uppercase; color:#556117; margin-bottom:10px;\">City<\u002Flabel>\n          <input defaultvalue=\"Los Angeles, CA\" style=\"width:100%; background:transparent; border:none; border-bottom:1px solid rgba(236,228,210,.16); color:#ece4d2; font-family:'Spectral',serif; font-size:18px; padding:6px 0 12px; outline:none;\" style-focus=\"border-bottom-color:#a98f52;\">\n        <\u002Fdiv>\n        <div style=\"padding-top:8px;\">\n          <p style=\"font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.22em; text-transform:uppercase; color:#556117; margin:0 0 12px;\">{{ settingsPayoutLabel }}<\u002Fp>\n          <p style=\"font-family:'Albert Sans',sans-serif; font-size:14px; color:#cfc6b2; margin:0 0 14px; max-width:520px;\">{{ settingsPayoutBody }}<\u002Fp>\n          <button style=\"background:transparent; color:#ece4d2; border:1px solid rgba(236,228,210,.2); padding:12px 22px; font-family:'Albert Sans'; font-size:13px; letter-spacing:.03em; cursor:pointer;\" style-hover=\"border-color:#a98f52; color:#a98f52;\">{{ settingsPayoutCta }}<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"margin-top:8px;\">\n          <button style=\"background:#556117; color:#171320; border:none; padding:14px 28px; font-family:'Albert Sans'; font-size:14px; font-weight:600; letter-spacing:.04em; cursor:pointer;\" style-hover=\"background:#738e68;\">Save changes<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ═══════════ FAQ ═══════════ -->\n  <sc-if value=\"{{ isFaq }}\" hint-placeholder-val=\"\">\n    <div style=\"max-width:820px; margin:0 auto; padding:46px 34px 100px;\">\n      <h1 style=\"font-family:'Spectral',serif; font-weight:300; font-size:clamp(34px,4.6vw,54px); color:#ece4d2; margin:0;\">Frequently asked questions<\u002Fh1>\n      <p style=\"font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:#a89e88; margin:12px 0 0;\">Last updated · {{ faqUpdated }}<\u002Fp>\n\n      <div style=\"display:flex; gap:28px; margin-top:30px; border-bottom:1px solid rgba(236,228,210,.16);\">\n        <sc-for list=\"{{ faqTabs }}\" as=\"t\" hint-placeholder-count=\"2\">\n          <button onclick=\"{{ t.onClick }}\" style=\"{{ t.style }}\">{{ t.label }}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <div style=\"margin-top:6px;\">\n        <sc-for list=\"{{ faqList }}\" as=\"q\" hint-placeholder-count=\"4\">\n          <div style=\"padding:30px 0; border-bottom:1px solid rgba(236,228,210,.12);\">\n            <h3 style=\"font-family:'Spectral',serif; font-weight:400; font-size:24px; color:#ece4d2; margin:0 0 12px;\">{{ q.q }}<\u002Fh3>\n            <p style=\"font-family:'Albert Sans',sans-serif; font-size:15.5px; line-height:1.7; color:#cfc6b2; margin:0;\">{{ q.a }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ═══════════ STUDIO · add a work ═══════════ -->\n  <sc-if value=\"{{ isStudio }}\" hint-placeholder-val=\"\">\n    <div>\n      <div style=\"max-width:1220px; margin:0 auto; padding:44px 34px 6px;\">\n        <button onclick=\"{{ goMe }}\" style=\"background:transparent; border:none; cursor:pointer; font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:#738e68; padding:0; margin-bottom:16px;\" style-hover=\"color:#a98f52;\">← back to profile<\u002Fbutton>\n        <p style=\"font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.28em; text-transform:uppercase; color:#556117; margin:0; display:inline-flex; align-items:center; gap:12px;\"><span style=\"width:26px; height:1px; background:#556117;\"><\u002Fspan>Your studio<\u002Fp>\n        <h1 style=\"font-family:'Spectral',serif; font-weight:300; font-size:clamp(40px,5vw,60px); line-height:1.03; letter-spacing:-0.02em; color:#ece4d2; margin:16px 0 0;\">List a <span style=\"font-style:italic; color:#a98f52;\">new work.<\u002Fspan><\u002Fh1>\n        <p style=\"font-family:'Spectral',serif; font-size:17px; line-height:1.6; color:#cfc6b2; margin:18px 0 0; max-width:560px;\">Upload a poster of the piece, set its details, and choose whether to offer prints alongside the original.<\u002Fp>\n      <\u002Fdiv>\n\n      <div style=\"display:grid; grid-template-columns:minmax(0,1.42fr) minmax(0,1fr); gap:40px; max-width:1220px; margin:0 auto; padding:30px 34px 90px; align-items:start;\">\n\n        <div style=\"background:#2a2333; border:1px solid rgba(236,228,210,.16); padding:30px 30px 34px;\">\n          <p style=\"font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.26em; text-transform:uppercase; color:#556117; margin:0 0 22px; font-weight:500;\">The piece<\u002Fp>\n\n          <div onclick=\"{{ onPick }}\" ondrop=\"{{ onDrop }}\" ondragover=\"{{ onDragOver }}\" ondragleave=\"{{ onDragLeave }}\" style=\"position:relative; aspect-ratio:16/9; border:1px dashed rgba(236,228,210,.28); background:#1f1a26; display:grid; place-items:center; text-align:center; cursor:pointer; overflow:hidden; margin-bottom:28px;\" style-hover=\"border-color:#a98f52;\">\n            <sc-if value=\"{{ draftImage }}\" hint-placeholder-val=\"\">\n              <img src=\"{{ draftImage }}\" alt=\"Work poster\" style=\"position:absolute; inset:0; width:100%; height:100%; object-fit:cover;\">\n            <\u002Fsc-if>\n            <sc-if value=\"{{ noImage }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"padding:20px;\">\n                <div style=\"width:30px; height:30px; margin:0 auto 12px; border:1px solid #556117; display:grid; place-items:center; color:#556117; font-family:'Spectral',serif; font-size:18px;\">+<\u002Fdiv>\n                <div style=\"font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:#a89e88;\">Drop a poster of the work<\u002Fdiv>\n                <div style=\"font-family:'Albert Sans',sans-serif; font-size:12px; color:#738e68; margin-top:6px;\">or click to browse — JPG / PNG<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <input type=\"file\" accept=\"image/*\" ref=\"{{ fileRef }}\" onchange=\"{{ onFileInput }}\" style=\"display:none;\">\n          <\u002Fdiv>\n\n          <div style=\"margin-bottom:22px;\">\n            <label style=\"display:block; font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.22em; text-transform:uppercase; color:#556117; margin-bottom:10px;\">Title<\u002Flabel>\n            <input value=\"{{ title }}\" onchange=\"{{ onTitle }}\" placeholder=\"e.g. Salt Flat, Late Light\" style=\"width:100%; background:transparent; border:none; border-bottom:1px solid rgba(236,228,210,.16); color:#ece4d2; font-family:'Spectral',serif; font-size:19px; padding:6px 0 12px; outline:none;\" style-focus=\"border-bottom-color:#a98f52;\">\n          <\u002Fdiv>\n\n          <div style=\"display:grid; grid-template-columns:1fr 1fr; gap:22px 26px; margin-bottom:22px;\">\n            <div>\n              <label style=\"display:block; font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.22em; text-transform:uppercase; color:#556117; margin-bottom:10px;\">Medium<\u002Flabel>\n              <input value=\"{{ medium }}\" onchange=\"{{ onMedium }}\" placeholder=\"Oil on linen\" style=\"width:100%; background:transparent; border:none; border-bottom:1px solid rgba(236,228,210,.16); color:#ece4d2; font-family:'Spectral',serif; font-size:17px; padding:6px 0 12px; outline:none;\" style-focus=\"border-bottom-color:#a98f52;\">\n            <\u002Fdiv>\n            <div>\n              <label style=\"display:block; font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.22em; text-transform:uppercase; color:#556117; margin-bottom:10px;\">Year<\u002Flabel>\n              <input value=\"{{ year }}\" onchange=\"{{ onYear }}\" placeholder=\"2025\" style=\"width:100%; background:transparent; border:none; border-bottom:1px solid rgba(236,228,210,.16); color:#ece4d2; font-family:'Spectral',serif; font-size:17px; padding:6px 0 12px; outline:none;\" style-focus=\"border-bottom-color:#a98f52;\">\n            <\u002Fdiv>\n            <div>\n              <label style=\"display:block; font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.22em; text-transform:uppercase; color:#556117; margin-bottom:10px;\">Dimensions<\u002Flabel>\n              <input value=\"{{ dimensions }}\" onchange=\"{{ onDimensions }}\" placeholder=\"24 × 30 in\" style=\"width:100%; background:transparent; border:none; border-bottom:1px solid rgba(236,228,210,.16); color:#ece4d2; font-family:'Spectral',serif; font-size:17px; padding:6px 0 12px; outline:none;\" style-focus=\"border-bottom-color:#a98f52;\">\n            <\u002Fdiv>\n            <div>\n              <label style=\"display:block; font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.22em; text-transform:uppercase; color:#556117; margin-bottom:10px;\">Weight<\u002Flabel>\n              <input value=\"{{ weight }}\" onchange=\"{{ onWeight }}\" placeholder=\"9 lb\" style=\"width:100%; background:transparent; border:none; border-bottom:1px solid rgba(236,228,210,.16); color:#ece4d2; font-family:'Spectral',serif; font-size:17px; padding:6px 0 12px; outline:none;\" style-focus=\"border-bottom-color:#a98f52;\">\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"margin-bottom:6px;\">\n            <label style=\"display:block; font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.22em; text-transform:uppercase; color:#556117; margin-bottom:10px;\">Price of original · USD<\u002Flabel>\n            <input value=\"{{ price }}\" onchange=\"{{ onPrice }}\" placeholder=\"4,200\" style=\"width:100%; background:transparent; border:none; border-bottom:1px solid rgba(236,228,210,.16); color:#ece4d2; font-family:'Spectral',serif; font-size:19px; padding:6px 0 12px; outline:none;\" style-focus=\"border-bottom-color:#a98f52;\">\n          <\u002Fdiv>\n\n          <div style=\"margin-top:34px; padding-top:28px; border-top:1px solid rgba(236,228,210,.16);\">\n            <div style=\"display:flex; align-items:flex-start; justify-content:space-between; gap:20px;\">\n              <div style=\"max-width:70%;\">\n                <p style=\"font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.26em; text-transform:uppercase; color:#556117; margin:0 0 8px; font-weight:500;\">Prints<\u002Fp>\n                <p style=\"font-family:'Spectral',serif; font-size:15.5px; line-height:1.5; color:#cfc6b2; margin:0;\">Offer prints of this piece in multiple sizes — plus a pricier signed &amp; numbered edition.<\u002Fp>\n              <\u002Fdiv>\n              <button onclick=\"{{ togglePrints }}\" aria-label=\"Toggle prints\" style=\"flex:0 0 auto; width:46px; height:26px; border-radius:13px; border:none; padding:0; position:relative; cursor:pointer; transition:background .2s; background:{{ switchBg }};\">\n                <span style=\"position:absolute; top:3px; left:0; width:20px; height:20px; border-radius:50%; background:#ece4d2; transition:transform .2s; transform:translateX({{ knobX }});\"><\u002Fspan>\n              <\u002Fbutton>\n            <\u002Fdiv>\n\n            <sc-if value=\"{{ offerPrints }}\" hint-placeholder-val=\"\">\n              <div style=\"margin-top:26px; animation:kudzuReveal .3s ease both;\">\n                <div style=\"background:#1f1a26; border:1px solid rgba(236,228,210,.12); padding:20px 20px 22px; margin-bottom:18px;\">\n                  <div style=\"display:flex; align-items:baseline; justify-content:space-between; margin-bottom:16px;\">\n                    <div>\n                      <h4 style=\"font-family:'Spectral',serif; font-weight:400; font-size:20px; color:#ece4d2; margin:0;\">Open prints<\u002Fh4>\n                      <p style=\"font-family:'Albert Sans',sans-serif; font-size:12px; color:#738e68; margin:4px 0 0;\">Standard sizes · unsigned · print-on-demand<\u002Fp>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"display:grid; grid-template-columns:1fr 110px 34px; gap:10px; margin-bottom:8px; font-family:'JetBrains Mono',monospace; font-size:9px; letter-spacing:.18em; text-transform:uppercase; color:#a89e88;\">\n                    <span>Size<\u002Fspan><span>Price<\u002Fspan><span><\u002Fspan>\n                  <\u002Fdiv>\n                  <sc-for list=\"{{ standardRows }}\" as=\"row\" hint-placeholder-count=\"2\">\n                    <div style=\"display:grid; grid-template-columns:1fr 110px 34px; gap:10px; align-items:center; margin-bottom:9px;\">\n                      <input value=\"{{ row.size }}\" onchange=\"{{ row.onSize }}\" placeholder=\"8 × 10 in\" style=\"width:100%; background:#2a2333; border:1px solid rgba(236,228,210,.14); color:#ece4d2; font-family:'Albert Sans',sans-serif; font-size:13px; padding:11px 12px; outline:none;\" style-focus=\"border-color:#a98f52;\">\n                      <input value=\"{{ row.price }}\" onchange=\"{{ row.onPrice }}\" placeholder=\"$45\" style=\"width:100%; background:#2a2333; border:1px solid rgba(236,228,210,.14); color:#ece4d2; font-family:'Albert Sans',sans-serif; font-size:13px; padding:11px 12px; outline:none;\" style-focus=\"border-color:#a98f52;\">\n                      <button onclick=\"{{ row.onRemove }}\" aria-label=\"Remove size\" style=\"background:transparent; border:1px solid rgba(236,228,210,.14); color:#a89e88; font-size:15px; line-height:1; padding:9px 0; cursor:pointer;\" style-hover=\"color:#a98f52; border-color:#a98f52;\">×<\u002Fbutton>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                  <button onclick=\"{{ addStandard }}\" style=\"margin-top:8px; background:transparent; border:none; color:#738e68; font-family:'Albert Sans',sans-serif; font-size:12px; letter-spacing:.06em; cursor:pointer; padding:4px 0;\" style-hover=\"color:#a98f52;\">+ Add a size<\u002Fbutton>\n                <\u002Fdiv>\n\n                <div style=\"background:#1d2718; border:1px solid rgba(115,142,104,.35); padding:20px 20px 22px;\">\n                  <div style=\"display:flex; align-items:baseline; justify-content:space-between; margin-bottom:16px;\">\n                    <div>\n                      <h4 style=\"font-family:'Spectral',serif; font-weight:400; font-size:20px; color:#ece4d2; margin:0;\">Signed &amp; numbered <span style=\"font-style:italic; color:#a98f52;\">editions<\u002Fspan><\u002Fh4>\n                      <p style=\"font-family:'Albert Sans',sans-serif; font-size:12px; color:#738e68; margin:4px 0 0;\">Museum stock · hand-signed · limited run · priced higher<\u002Fp>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"display:grid; grid-template-columns:1fr 84px 110px 34px; gap:10px; margin-bottom:8px; font-family:'JetBrains Mono',monospace; font-size:9px; letter-spac ter-spacing:.06em; cursor:pointer; padding:4px 0;\" style-hover=\"color:#a98f52;\">+ Add an edition size<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n\n          <div style=\"margin-top:30px; display:flex; align-items:center; gap:18px;\">\n            <button onclick=\"{{ save }}\" style=\"background:#556117; color:#171320; border:none; padding:15px 30px; font-family:'Albert Sans',sans-serif; font-size:14px; font-weight:600; letter-spacing:.04em; cursor:pointer; transition:background .2s;\" style-hover=\"background:#738e68;\">Save to your gallery  →<\u002Fbutton>\n            <sc-if value=\"{{ savedFlash }}\" hint-placeholder-val=\"\">\n              <span style=\"font-family:'Spectral',serif; font-style:italic; font-size:15px; color:#738e68; animation:kudzuFade .3s ease both;\">Saved — it's in your gallery.<\u002Fspan>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"position:sticky; top:88px;\">\n          <p style=\"font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.26em; text-transform:uppercase; color:#556117; margin:0 0 16px; font-weight:500;\">Live preview<\u002Fp>\n          <div style=\"background:#2a2333; border:1px solid rgba(236,228,210,.16); padding:16px;\">\n            <div style=\"position:relative; aspect-ratio:4/5; background:#1f1a26; overflow:hidden; margin-bottom:16px;\">\n              <sc-if value=\"{{ pvImage }}\" hint-placeholder-val=\"\">\n                <img src=\"{{ pvImage }}\" alt=\"Preview\" style=\"position:absolute; inset:0; width:100%; height:100%; object-fit:cover;\">\n              <\u002Fsc-if>\n              <sc-if value=\"{{ noImage }}\" hint-placeholder-val=\"{{ true }}\">\n                <div style=\"position:absolute; inset:0; display:grid; place-items:center; background:radial-gradient(120% 90% at 30% 20%, rgba(255,255,255,0.05), transparent 60%);\">\n                  <span style=\"font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:#a89e88;\">Poster preview<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <span style=\"position:absolute; top:12px; left:12px; font-family:'JetBrains Mono',monospace; font-size:9px; letter-spacing:.14em; text-transform:uppercase; padding:5px 10px; background:#556117; color:#171320;\">For sale<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex; justify-content:space-between; align-items:baseline; gap:12px;\">\n              <h3 style=\"font-family:'Spectral',serif; font-weight:400; font-size:21px; line-height:1.2; color:#ece4d2; margin:0;\">{{ pvTitle }}<\u002Fh3>\n              <span style=\"font-family:'JetBrains Mono',monospace; font-size:13px; color:#a98f52; white-space:nowrap;\">{{ pvPrice }}<\u002Fspan>\n            <\u002Fdiv>\n            <p style=\"font-family:'Spectral',serif; font-style:italic; font-size:14px; color:#738e68; margin:6px 0 0;\">{{ pvSpec }}<\u002Fp>\n            <p style=\"font-family:'Albert Sans',sans-serif; font-size:12px; color:#cfc6b2; margin:5px 0 0;\">{{ pvDims }}{{ pvWeight }}<\u002Fp>\n            <sc-if value=\"{{ pvHasPrints }}\" hint-placeholder-val=\"\">\n              <div style=\"margin-top:14px; padding-top:13px; border-top:1px solid rgba(236,228,210,.16); font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:.06em; color:#a98f52;\">{{ pvPrints }}<\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n\n          <div style=\"display:flex; align-items:baseline; justify-content:space-between; margin:34px 0 14px;\">\n            <p style=\"font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.26em; text-transform:uppercase; color:#556117; margin:0; font-weight:500;\">Your gallery<\u002Fp>\n            <span style=\"font-family:'JetBrains Mono',monospace; font-size:11px; color:#a89e88;\">{{ workCount }} works<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"border-top:1px solid rgba(236,228,210,.16);\">\n            <sc-for list=\"{{ galleryList }}\" as=\"w\" hint-placeholder-count=\"1\">\n              <div style=\"display:grid; grid-template-columns:56px 1fr auto; gap:14px; align-items:center; padding:15px 4px; border-bottom:1px solid rgba(236,228,210,.16);\">\n                <div style=\"width:56px; height:56px; overflow:hidden; position:relative; background:{{ w.tone }};\">\n                  <sc-if value=\"{{ w.image }}\" hint-placeholder-val=\"\">\n                    <img src=\"{{ w.image }}\" alt=\"\" style=\"position:absolute; inset:0; width:100%; height:100%; object-fit:cover;\">\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n                <div style=\"min-width:0;\">\n                  <div style=\"font-family:'Spectral',serif; font-size:16px; color:#ece4d2; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;\">{{ w.title }}<\u002Fdiv>\n                  <div style=\"font-family:'Albert Sans',sans-serif; font-size:12px; color:#738e68; margin-top:2px;\">{{ w.spec }}<\u002Fdiv>\n                  <sc-if value=\"{{ w.hasPrints }}\" hint-placeholder-val=\"\">\n                    <div style=\"font-family:'JetBrains Mono',monospace; font-size:9.5px; letter-spacing:.05em; color:#556117; margin-top:4px;\">{{ w.prints }}<\u002Fdiv>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n                <div style=\"font-family:'JetBrains Mono',monospace; font-size:12px; color:#a98f52; white-space:nowrap;\">{{ w.price }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{\n  &quot;$preview&quot;: { &quot;width&quot;: 1240, &quot;height&quot;: 900 },\n  &quot;artistName&quot;: { &quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;Ian Patrick Cato&quot;, &quot;tsType&quot;: &quot;string&quot; },\n  &quot;startOnStudio&quot;: { &quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: false, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Preview&quot; }\n}\">\nclass Component extends DCLogic {\n  constructor(props){\n    super(props);\n    this.fileRef = React.createRef();\n    this.photoRef = React.createRef();\n    this.state = {\n      screen: 'login',\n      role: 'artist',\n      loggedRole: 'artist',\n      menuOpen: false,\n      calloutDismissed: false,\n      profileTab: 'work',\n      faqTab: 'artists',\n      profilePhoto: null,\n      email: '',\n      password: '',\n      dragOver: false,\n      savedFlash: false,\n      draft: this.blank(),\n      works: [\n        { title:'Marsh Grass, Slack Tide', medium:'Oil on linen', year:'2025', dimensions:'24 × 30 in', weight:'9 lb', price:'4200', tone:'#2f2738', sold:false, image:null, offerPrints:true,\n          standard:[{size:'8 × 10 in',edition:'',price:'45'},{size:'16 × 20 in',edition:'',price:'95'}], signed:[{size:'18 × 24 in',edition:'/50',price:'220'}] },\n        { title:'Kudzu Study No. 4', medium:'Gouache on paper', year:'2025', dimensions:'14 × 11 in', weight:'2 lb', price:'1200', tone:'#26331f', sold:false, image:null, offerPrints:false, standard:[], signed:[] },\n        { title:'Understory', medium:'Acrylic on canvas', year:'2025', dimensions:'20 × 16 in', weight:'5 lb', price:'1900', tone:'#2a3340', sold:false, image:null, offerPrints:false, standard:[], signed:[] },\n        { title:'Low Country Nocturne', medium:'Oil on panel', year:'2024', dimensions:'18 × 24 in', weight:'6 lb', price:'2800', tone:'#3a2f2a', sold:true, image:null, offerPrints:false, standard:[], signed:[] },\n        { title:'Tidewater', medium:'Oil on linen', year:'2023', dimensions:'30 × 40 in', weight:'14 lb', price:'5600', tone:'#473a2c', sold:true, image:null, offerPrints:false, standard:[], signed:[] },\n      ],\n    };\n  }\n\n  blank(){\n    return { title:'', medium:'', year:'', dimensions:'', weight:'', price:'', image:null, tone:'#2a2333',\n      offerPrints:false, standard:[{size:'',edition:'',price:''}], signed:[{size:'',edition:'',price:''}] };\n  }\n\n  componentDidMount(){ if(this.props.startOnStudio) this.setState({screen:'studio'}); }\n\n  go(screen){ this.setState({screen, menuOpen:false}); }\n  upd(key){ return e => { const v=e.target.value; this.setState(s=>({draft:{...s.draft,[key]:v}})); }; }\n  toggle(){ this.setState(s=>({draft:{...s.draft, offerPrints: !s.draft.offerPrints}})); }\n  addRow(key){ this.setState(s=>({draft:{...s.draft,[key]:[...s.draft[key], {size:'',edition:'',price:''}]}})); }\n  removeRow(key,i){ this.setState(s=>({draft:{...s.draft,[key]: s.draft[key].filter((_,j)=>j!==i)}})); }\n  updRow(key,i,field,val){ this.setState(s=>({draft:{...s.draft,[key]: s.draft[key].map((r,j)=> j===i?{...r,[field]:val}:r)}})); }\n\n  handleFiles(files){ const f=files&&files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>this.setState(s=>({draft:{...s.draft, image:r.result}})); r.readAsDataURL(f); }\n  handlePhoto(files){ const f=files&&files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>this.setState({profilePhoto:r.result}); r.readAsDataURL(f); }\n\n  money(v){ if(v==null||v==='') return ''; const n=String(v).replace(/[^0-9.]/g,''); if(!n) return String(v); return '$'+Number(n).toLocaleString(); }\n  minPrice(rows){ const nums=(rows||[]).map(r=>Number(String(r.price).replace(/[^0-9.]/g,''))).filter(n=>n>0); return nums.length?Math.min(...nums):null; }\n  printsLine(w){ const p=[]; const s=this.minPrice(w.standard); const g=this.minPrice(w.signed); if(s!=null)p.push('Prints from '+this.money(s)); if(g!=null)p.push('Signed from '+this.money(g)); return p.join('  ·  '); }\n\n  save(){ const d=this.state.draft; if(!d.title.trim()) return; this.setState(s=>({works:[{...d, sold:false}, ...s.works], draft:this.blank(), savedFlash:true})); if(this._t)clearTimeout(this._t); this._t=setTimeout(()=>this.setState({savedFlash:false}),2600); }\n\n  seg(active){ return 'flex:1; text-align:center; padding:11px 0; font-family:\\'Albert Sans\\',sans-serif; font-size:13px; letter-spacing:.03em; border:none; cursor:pointer; transition:background .2s;' + (active ? 'background:#556117; color:#171320;' : 'background:transparent; color:#cfc6b2;'); }\n  tab(active){ return 'background:transparent; border:none; cursor:pointer; font-family:\\'Spectral\\',serif; font-size:18px; padding:0 0 13px; margin-bottom:-1px; transition:color .2s;' + (active ? 'color:#ece4d2; border-bottom:2px solid #a98f52;' : 'color:#a89e88; border-bottom:2px solid transparent;'); }\n\n  renderVals(){\n    const d=this.state.draft;\n    const scr=this.state.screen;\n    const isArtist=this.state.loggedRole==='artist';\n    const name=this.props.artistName || 'Ian Patrick Cato';\n    const handle=(name.trim().split(/\\s+/)[0]||'me').toLowerCase();\n\n    const mk=(key)=> d[key].map((r,i)=>({ size:r.size, edition:r.edition, price:r.price,\n      onSize:e=>this.updRow(key,i,'size',e.target.value), onEdition:e=>this.updRow(key,i,'edition',e.target.value),\n      onPrice:e=>this.updRow(key,i,'price',e.target.value), onRemove:()=>this.removeRow(key,i) }));\n    const sMin=this.minPrice(d.standard), gMin=this.minPrice(d.signed);\n    const previewPrints=d.offerPrints ? [ sMin!=null?('Prints from '+this.money(sMin)):null, gMin!=null?('Signed from '+this.money(gMin)):null ].filter(Boolean).join('    ·    ') : '';\n\n    const toTile=w=>({ title:w.title, price:this.money(w.price), tone:w.tone||'#2a2333', image:w.image, spec:[w.medium,w.year].filter(Boolean).join(', ') });\n    const available=this.state.works.filter(w=>!w.sold);\n    const sold=this.state.works.filter(w=>w.sold);\n\n    const views={\n      inquiries:{ title:'Inquiries', count:0, et:'No conversations yet', eb:'Start a conversation by pressing “Inquire” on any work.', en:'Discuss pricing, ask questions, and make offers directly with the artist.' },\n      orders:{ title:'Orders', count:0, et:'No orders yet', eb:'Works you purchase will appear here.', en:'Anyone can buy an available work without an account — an order only needs your shipping and payment details.' },\n      sales:{ title:'Sales', count:0, et:'No sales yet', eb:'When a collector buys one of your works, it shows up here.', en:'Your payout lands after the work is delivered — Kudzu handles the transaction and takes a 30% commission.' },\n      favorites:{ title:'Favorites', count:0, et:'Nothing saved yet', eb:'Tap the ♡ on any work to keep it here.', en:'Favorites are private to your account.' },\n    };\n    const view=views[scr];\n\n    const artistMenu=[['me','profile'],['orders','orders'],['sales','sales'],['inquiries','inquiries'],['favorites','favorites'],['settings','settings']];\n    const collectorMenu=[['me','profile'],['orders','orders'],['inquiries','inquiries'],['favorites','favorites'],['settings','settings']];\n    const menuItems=(isArtist?artistMenu:collectorMenu).map(([label,s])=>({ label, onClick:()=>this.go(s) }));\n\n    const profileTabsDef=[['work','work'],['sold','sold'],['bio','bio'],['c.v','cv'],['guestbook','guestbook']];\n    const profileTabs=profileTabsDef.map(([label,key])=>({ label, onClick:()=>this.setState({profileTab:key}), style:this.tab(this.state.profileTab===key) }));\n\n    const faqTabs=[['for collectors','collectors'],['for artists','artists']].map(([label,key])=>({ label, onClick:()=>this.setState({faqTab:key}), style:this.tab(this.state.faqTab===key) }));\n    const faqCollectors=[\n      {q:'Do I need an account to buy?', a:'No. Anyone can purchase an available work directly — you only add shipping and payment at checkout. A free, private collector profile lets you message artists, make offers, and save favorites.'},\n      {q:'Is my collector profile public?', a:'No. Collector profiles live only inside Kudzu — used to inquire, make offers, and track orders. They are never shown publicly.'},\n      {q:'How do I reach an artist?', a:'Press “Inquire” on any work to open a private conversation with the artist about price, availability, or a commission.'},\n      {q:'How does shipping work?', a:'The collector covers shipping and any applicable sales tax. The artist packs and ships within 7 days of a confirmed sale, or the purchase is refunded in full.'},\n    ];\n    const faqArtists=[\n      {q:'Who can sell work on Kudzu?', a:'Kudzu is invitation only. We personally invite the artists we represent — there are no open submissions.'},\n      {q:'What can I sell?', a:'Fine art only: painting, drawing, sculpture, ceramics, mixed media, photography, and print editions — originals and signed, numbered prints.'},\n      {q:'How do I get paid?', a:'Link a payout account through Stripe. Your share is deposited by direct deposit after the work is delivered.'},\n      {q:'Does Kudzu take a commission?', a:'When a work sells, the artist keeps 70% and Kudzu takes a 30% commission to cover operations, payment processing, and advocacy on your behalf.'},\n      {q:'How does shipping work?', a:'The collector covers shipping and tax. A prepaid label is generated when a work sells; you have 7 days to ship it, or the purchase is refunded to the collector.'},\n    ];\n\n    return {\n      showApp: scr!=='login',\n      isLogin: scr==='login',\n      isProfile: scr==='profile',\n      isProfileArtist: scr==='profile' && isArtist,\n      isProfileCollector: scr==='profile' && !isArtist,\n      isStudio: scr==='studio',\n      isFaq: scr==='faq',\n      isSettings: scr==='settings',\n      isList: !!view,\n\n      // header\n      accountHandle: handle,\n      menuOpen: this.state.menuOpen,\n      menuItems,\n      toggleMenu: ()=>this.setState(s=>({menuOpen:!s.menuOpen})),\n      goMe: ()=>this.go('profile'), goStudio: ()=>this.go('studio'), goFaq: ()=>this.go('faq'),\n      goInquiries: ()=>this.go('inquiries'), goOrders: ()=>this.go('orders'), goFavorites: ()=>this.go('favorites'),\n      signOut: ()=>this.setState({screen:'login', menuOpen:false}),\n\n      // login\n      role:this.state.role,\n      setArtist: ()=>this.setState({role:'artist'}), setCollector: ()=>this.setState({role:'collector'}),\n      segArtist: this.seg(this.state.role==='artist'), segCollector: this.seg(this.state.role==='collector'),\n      loginEyebrow: this.state.role==='artist' ? 'Artist sign in' : 'Collector sign in',\n      loginAccent: this.state.role==='artist' ? 'back.' : 'in.',\n      loginLede: this.state.role==='artist'\n        ? 'Manage your profile and the work you have for sale — originals, prints, and signed editions.'\n        : 'A private profile to message artists, make offers, save favorites, and track your orders.',\n      loginCta: this.state.role==='artist' ? 'Enter your studio  →' : 'Enter your account  →',\n      loginAlt: this.state.role==='artist' ? 'Invite only' : 'New here? Create a profile →',\n      email:this.state.email, onEmail:e=>this.setState({email:e.target.value}),\n      password:this.state.password, onPassword:e=>this.setState({password:e.target.value}),\n      signIn: ()=>this.setState({loggedRole:this.state.role, screen:'profile', menuOpen:false}),\n\n      // profile\n      artistName:name,\n      profilePhoto:this.state.profilePhoto, noPhoto: !this.state.profilePhoto,\n      photoRef:this.photoRef, onPickPhoto:()=>{ if(this.photoRef.current) this.photoRef.current.click(); },\n      onPhotoInput:e=>this.handlePhoto(e.target.files),\n      showCallout: isArtist && !this.state.calloutDismissed,\n      dismissCallout: ()=>this.setState({calloutDismissed:true}),\n      profileTabs,\n      tabWork:this.state.profileTab==='work', tabSold:this.state.profileTab==='sold',\n      tabBio:this.state.profileTab==='bio', tabCv:this.state.profileTab==='cv', tabGuest:this.state.profileTab==='guestbook',\n      workTiles: available.map(toTile), soldTiles: sold.map(toTile), publishedCount: available.length,\n      cvRows:[\n        {year:'2025', title:'The Mud, The Sky, and the 395', venue:'la BEAST Gallery', city:'Los Angeles'},\n        {year:'2023', title:'Daydream Jelly', venue:'la BEAST Gallery', city:'Los Angeles'},\n        {year:'2020', title:'Group Exhibition', venue:'Blum & Poe', city:'Los Angeles'},\n      ],\n\n      // list view\n      viewTitle:view?view.title:'', viewCount:view?view.count:0,\n      viewEmptyTitle:view?view.et:'', viewEmptyBody:view?view.eb:'', viewEmptyNote:view?view.en:'',\n\n      // settings\n      settingsPayoutLabel: isArtist ? 'Payout · Stripe' : 'Profile visibility',\n      settingsPayoutBody: isArtist ? 'Connect a bank account through Stripe to receive your share of a sale — deposited after the work is delivered.' : 'Your collector profile is private inside Kudzu. Only you and artists you contact can see it.',\n      settingsPayoutCta: isArtist ? 'Connect Stripe' : 'Private — only you & artists you message',\n\n      // faq\n      faqUpdated:'December 2025',\n      faqTabs, faqList: this.state.faqTab==='collectors' ? faqCollectors : faqArtists,\n\n      // studio\n      title:d.title, onTitle:this.upd('title'), medium:d.medium, onMedium:this.upd('medium'),\n      year:d.year, onYear:this.upd('year'), dimensions:d.dimensions, onDimensions:this.upd('dimensions'),\n      weight:d.weight, onWeight:this.upd('weight'), price:d.price, onPrice:this.upd('price'),\n      offerPrints:d.offerPrints, togglePrints:()=>this.toggle(),\n      switchBg: d.offerPrints ? '#556117' : 'rgba(236,228,210,.18)', knobX: d.offerPrints ? '23px' : '3px',\n      standardRows:mk('standard'), signedRows:mk('signed'), addStandard:()=>this.addRow('standard'), addSigned:()=>this.addRow('signed'),\n      fileRef:this.fileRef, onPick:()=>{ if(this.fileRef.current) this.fileRef.current.click(); },\n      onFileInput:e=>this.handleFiles(e.target.files),\n      onDrop:e=>{ e.preventDefault(); this.setState({dragOver:false}); this.handleFiles(e.dataTransfer.files); },\n      onDragOver:e=>{ e.preventDefault(); if(!this.state.dragOver) this.setState({dragOver:true}); },\n      onDragLeave:()=>this.setState({dragOver:false}),\n      draftImage:d.image, noImage: !d.image, save:()=>this.save(), savedFlash:this.state.savedFlash,\n      pvImage:d.image, pvTitle:d.title||'Untitled work',\n      pvSpec:[d.medium,d.year].filter(Boolean).join(', ')||'Medium · Year',\n      pvDims:d.dimensions||'Dimensions', pvWeight:d.weight?(' · '+d.weight):'',\n      pvPrice:d.price?this.money(d.price):'Price on request',\n      pvHasPrints:d.offerPrints && previewPrints!=='', pvPrints:previewPrints,\n      galleryList:this.state.works.map(w=>({ title:w.title, image:w.image, tone:w.tone||'#2a2333',\n        spec:[w.medium,w.year].filter(Boolean).join(', '), price:this.money(w.price),\n        hasPrints: !!w.offerPrints && this.printsLine(w)!=='', prints:this.printsLine(w) })),\n      workCount:this.state.works.length,\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
